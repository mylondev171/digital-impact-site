panies too, which creates a detectable footprint.</p><p class="gl-why"><strong>Why 2:</strong> it does still work sometimes, which is why it persists. But the risk of manual actions, wasted money on links Google ignores, and the reputational cost of being caught make expected value low. Selling links can trigger penalties for the seller&#x27;s whole site.</p><a class="gl-perma" href="#link-buying-selling" aria-label="Link to Link buying / selling">#</a></article><article class="gl-term b2" id="social-syndication" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Social syndication</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Social syndication is distributing content across social platforms (LinkedIn, X, Facebook, Pinterest, YouTube) and republishing it on platforms like Medium or LinkedIn articles. Social links are nofollow and not a ranking factor, but distribution gets content seen by people who may link to it, and social posts themselves can rank and be cited.</p><p class="gl-ex"><strong>Example:</strong> a data study shared on LinkedIn reaches an editor who then covers it with a link.</p><p class="gl-why"><strong>Why 3:</strong> indirect value for Google. Slightly higher for LLMs, since platforms like LinkedIn and YouTube are frequently cited in AI answers.</p><a class="gl-perma" href="#social-syndication" aria-label="Link to Social syndication">#</a></article><article class="gl-term b3" id="backlink-profile-analysis" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Backlink profile analysis</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">This is auditing all links pointing to your site (using tools like Semrush, Ahrefs, or Search Console) to understand authority, spot growth or losses, compare with competitors, and identify risks. It is a diagnostic that guides the link strategy.</p><p class="gl-ex"><strong>Example:</strong> comparing your profile to the top three competitors shows they each have links from the state builders&#x27; association; you do not, which reveals a quick win.</p><p class="gl-why"><strong>Why 5:</strong> essential for planning and competitive insight, but analysis on its own does not move rankings.</p><a class="gl-perma" href="#backlink-profile-analysis" aria-label="Link to Backlink profile analysis">#</a></article><article class="gl-term b1" id="spam-link-discovery" data-term="" data-s="2"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Spam link discovery</h3><span class="gl-sc" aria-label="Impact score 2 out of 10"><b>2</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Spam link discovery is identifying toxic or manipulative links pointing to your site, then removing them or listing them in Google&#x27;s disavow file. Google now says it ignores most spammy links automatically, and that disavowing is only needed when you have a manual action or knowingly built bad links.</p><p class="gl-ex"><strong>Example:</strong> a site that bought 500 links in 2019 and received a manual action needs a cleanup. A site that receives random spam links from scraper sites does not.</p><p class="gl-why"><strong>Why 2:</strong> usually unnecessary and sometimes harmful, since disavowing good links removes their value. Critical only in penalty recovery.</p><a class="gl-perma" href="#spam-link-discovery" aria-label="Link to Spam link discovery">#</a></article><article class="gl-term b2" id="anchor-text-distribution" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Anchor text distribution</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">This is the mix of anchor texts in your backlink profile: branded (&quot;Acme Roofing&quot;), naked URL (&quot;acmeroofing.com&quot;), generic (&quot;this site&quot;), partial match (&quot;roofing tips from Acme&quot;), and exact match (&quot;metal roof repair Lexington&quot;). Natural profiles are mostly branded and generic. Heavy exact-match anchors were the main target of Google&#x27;s Penguin update.</p><p class="gl-ex"><strong>Example:</strong> if 60 percent of your links use &quot;best divorce lawyer Dallas,&quot; it looks built rather than earned.</p><p class="gl-why"><strong>Why 4:</strong> mainly a risk metric. Earned links produce a natural distribution automatically.</p><a class="gl-perma" href="#anchor-text-distribution" aria-label="Link to Anchor text distribution">#</a></article><article class="gl-term b1" id="link-velocity" data-term="" data-s="2"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Link velocity</h3><span class="gl-sc" aria-label="Impact score 2 out of 10"><b>2</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Link velocity is the rate at which a site gains (or loses) backlinks over time. The concern is that an unnatural spike might look manipulative. In reality, viral content and news coverage produce natural spikes all the time, and Google evaluates link quality, not raw speed.</p><p class="gl-ex"><strong>Example:</strong> a study going viral and earning 300 links in a week is normal. 300 links from unrelated blog networks in a week is suspicious because of the source, not the speed.</p><p class="gl-why"><strong>Why 2:</strong> mostly a myth as a standalone factor. Worth watching only as a symptom of something else.</p><a class="gl-perma" href="#link-velocity" aria-label="Link to Link velocity">#</a></article><article class="gl-term b5" id="brand-mentions-citations" data-term="" data-s="9"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Brand mentions / citations</h3><span class="gl-sc" aria-label="Impact score 9 out of 10"><b>9</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span><p class="gl-def">Brand mentions are references to your brand name across the web, whether linked or not: news articles, reviews, forums, podcasts, social posts, comparison articles. Google has long used unlinked mentions as a soft signal. For LLMs, mentions are the core signal: models learn and retrieve which brands are associated with which topics from how often and how positively they are mentioned together.</p><p class="gl-ex"><strong>Analogy:</strong> reputation in a small town. People recommend the plumber everyone talks about, not the one with the most signs.</p><p class="gl-ex"><strong>Example:</strong> when someone asks ChatGPT &quot;best CRM for real estate agents,&quot; the brands named are those most frequently and consistently mentioned alongside that phrase in reviews, listicles, Reddit threads, and articles.</p><p class="gl-why"><strong>Why 9:</strong> studies of AI visibility consistently find brand-mention frequency is among the strongest predictors of being cited or recommended by LLMs, ahead of backlinks.</p><a class="gl-perma" href="#brand-mentions-citations" aria-label="Link to Brand mentions / citations">#</a></article><article class="gl-term b2" id="influencer-collaboration" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Influencer collaboration</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Influencer collaboration means partnering with creators (YouTube, Instagram, TikTok, newsletters, blogs) to feature your product. Benefits for search are indirect: brand searches increase, mentions spread, and YouTube videos and creator posts are cited by AI answers. Paid partnerships must be disclosed and links marked sponsored.</p><p class="gl-ex"><strong>Example:</strong> a kitchen-knife brand gifted to 30 cooking YouTubers ends up named in video titles like &quot;Best Chef&#x27;s Knife Under $100,&quot; which both rank in Google and appear in AI answers.</p><p class="gl-why"><strong>Why 4:</strong> more a brand and demand-generation lever than an SEO lever, but it feeds brand mentions and branded search, which both matter.</p><a class="gl-perma" href="#influencer-collaboration" aria-label="Link to Influencer collaboration">#</a></article><article class="gl-term b3" id="podcast-interview-placements" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Podcast / interview placements</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Getting your experts interviewed on podcasts and industry shows earns show-notes links, brand mentions, and transcripts that are indexed and crawled. It also builds the person-entity of your experts, a growing E-E-A-T and LLM signal.</p><p class="gl-ex"><strong>Example:</strong> a founder appearing on 12 industry podcasts in a year gets 12 relevant links, 12 transcripts that tie their name to their topic, and audiences that search for the brand afterward.</p><p class="gl-why"><strong>Why 5:</strong> reliable, relevant, white-hat, and good for authority building. Individual podcast links are usually modest in strength.</p><a class="gl-perma" href="#podcast-interview-placements" aria-label="Link to Podcast / interview placements">#</a></article><article class="gl-term b2" id="resource-page-links" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Resource page links</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Resource pages are curated lists of helpful links (&quot;Resources for First-Time Homebuyers&quot;) on websites such as universities, libraries, government agencies, and associations. The tactic is finding relevant pages and asking to be included.</p><p class="gl-ex"><strong>Example:</strong> a free mortgage calculator gets listed on a credit union&#x27;s &quot;Homebuying Tools&quot; page.</p><p class="gl-why"><strong>Why 3:</strong> legitimate and occasionally yields strong .edu or .gov links. Many resource pages are neglected or exist only to sell placements, so the yield is low.</p><a class="gl-perma" href="#resource-page-links" aria-label="Link to Resource page links">#</a></article><article class="gl-term b1" id="private-blog-networks-pbns" data-term="" data-s="1"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Private blog networks (PBNs)</h3><span class="gl-sc" aria-label="Impact score 1 out of 10"><b>1</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">A PBN is a group of websites, often built on expired domains with leftover authority, that one person or company controls and uses only to link to its money sites. It is the classic black-hat link scheme.</p><p class="gl-ex"><strong>Analogy:</strong> writing your own letters of recommendation under fake names.</p><p class="gl-ex"><strong>Example:</strong> buying 20 expired domains of defunct local businesses, putting thin articles on each, and linking them all to your site. Google routinely deindexes networks and penalizes beneficiaries, sometimes years later.</p><p class="gl-why"><strong>Why 1:</strong> can produce short-term gains in some niches, which is why it persists among churn-and-burn affiliates. For any real business, expected value is negative.</p><a class="gl-perma" href="#private-blog-networks-pbns" aria-label="Link to Private blog networks (PBNs)">#</a></article><article class="gl-term b2" id="skyscraper-technique" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Skyscraper technique</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">The skyscraper technique, coined by Brian Dean around 2015, is finding content that already has many backlinks, creating something substantially better (more current, more complete, better designed), then contacting everyone who links to the original and asking them to link to yours.</p><p class="gl-ex"><strong>Example:</strong> an outdated 2019 guide to drone regulations has 200 links. You publish a fully updated 2026 guide with an interactive state-by-state map and pitch the linkers.</p><p class="gl-why"><strong>Why 4:</strong> the &quot;make something better&quot; half is excellent and drives content quality. The outreach half has been so overused that response rates are low, unless your asset offers real information gain.</p><a class="gl-perma" href="#skyscraper-technique" aria-label="Link to Skyscraper technique">#</a></article></div></div></section><section class="gl-sec gl-alt" id="keyword-research" data-spy="" aria-labelledby="keyword-research-h"><div class="wrap gl-sgrid"><aside class="gl-aside"><div class="gl-stick"><div class="gl-snum"><b>04</b><span>11 terms</span></div><h2 class="gl-sh" id="keyword-research-h">Keyword Research</h2><p class="gl-sintro">Keyword research decides what you build, so its value is upstream: a perfect page for the wrong query earns nothing. Intent classification is the single most important skill here; volume and difficulty numbers are useful estimates, not truths.</p><div class="gl-rbox"><span class="e-eb">Ranked by impact</span><ol class="gl-rank"><li class="b5" data-for="search-intent-classification"><a href="#search-intent-classification"><span class="gl-rn">Search intent classification</span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b4" data-for="long-tail-keywords"><a href="#long-tail-keywords"><span class="gl-rn">Long-tail keywords</span><span class="gl-rb" aria-hidden="true"><i style="width: 70%"></i></span><b>7</b></a></li><li class="b4" data-for="keyword-clustering-topic-grouping"><a href="#keyword-clustering-topic-grouping"><span class="gl-rn">Keyword clustering / topic grouping</span><span class="gl-rb" aria-hidden="true"><i style="width: 70%"></i></span><b>7</b></a></li><li class="b4" data-for="question-based-keywords-paa-mining"><a href="#question-based-keywords-paa-mining"><span class="gl-rn">Question-based keywords (PAA mining)</span><span class="gl-rb" aria-hidden="true"><i style="width: 70%"></i></span><b>7</b></a></li><li class="b3" data-for="search-volume-analysis"><a href="#search-volume-analysis"><span class="gl-rn">Search volume analysis</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="competitor-keyword-gap-analysis"><a href="#competitor-keyword-gap-analysis"><span class="gl-rn">Competitor keyword gap analysis</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="serp-feature-analysis-per-keyword"><a href="#serp-feature-analysis-per-keyword"><span class="gl-rn">SERP feature analysis per keyword</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="keyword-difficulty-scoring"><a href="#keyword-difficulty-scoring"><span class="gl-rn">Keyword difficulty scoring</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b3" data-for="zero-volume-keywords"><a href="#zero-volume-keywords"><span class="gl-rn">Zero-volume keywords</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b3" data-for="keyword-cannibalization-detection"><a href="#keyword-cannibalization-detection"><span class="gl-rn">Keyword cannibalization detection</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b2" data-for="seasonal-trending-keywords"><a href="#seasonal-trending-keywords"><span class="gl-rn">Seasonal / trending keywords</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li></ol><button type="button" class="gl-more" aria-expanded="false">Show all 11</button></div></div></aside><div class="gl-terms"><article class="gl-term b5" id="search-intent-classification" data-term="" data-s="9"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Search intent classification</h3><span class="gl-sc" aria-label="Impact score 9 out of 10"><b>9</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span><p class="gl-def">Search intent is the goal behind a query. Informational queries seek knowledge (&quot;how do heat pumps work&quot;). Navigational queries seek a specific site (&quot;Trane login&quot;). Commercial investigation queries compare options before buying (&quot;best heat pump brands 2026&quot;). Transactional queries are ready to act (&quot;heat pump installation near me,&quot; &quot;buy Mitsubishi mini split&quot;).</p><p class="gl-ex"><strong>Analogy:</strong> a customer walking into a store and asking &quot;what is this?&quot; needs a different response from one asking &quot;where do I pay?&quot; Hand the browser a checkout form and they leave.</p><p class="gl-ex"><strong>Example:</strong> a service company trying to rank its sales page for &quot;how do heat pumps work&quot; will fail, because Google shows educational guides for that query. The fix is a guide that links to the sales page.</p><p class="gl-why"><strong>Why 9:</strong> intent mismatch is the most common reason good pages do not rank. The fastest way to diagnose intent is to look at what currently ranks: Google is showing you what it believes satisfies the query.</p><a class="gl-perma" href="#search-intent-classification" aria-label="Link to Search intent classification">#</a></article><article class="gl-term b3" id="search-volume-analysis" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Search volume analysis</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Search volume is the estimated number of monthly searches for a keyword, reported by tools like Semrush, Ahrefs, and Google Keyword Planner. It helps prioritize opportunities by potential traffic.</p><p class="gl-ex"><strong>Example:</strong> &quot;roof repair&quot; may show 40,000 monthly searches nationally; &quot;roof repair Lexington KY&quot; may show 90. The second is far more valuable to a local roofer despite lower volume.</p><p class="gl-ex">Caveats: tool volumes are estimates that can be off by 50 percent or more, they are often rounded averages that hide seasonality, and one page usually ranks for hundreds of variations, so a single keyword&#x27;s volume understates real traffic.</p><p class="gl-why"><strong>Why 6:</strong> necessary for prioritization, but over-reliance leads teams to chase vanity keywords and ignore valuable low-volume terms.</p><a class="gl-perma" href="#search-volume-analysis" aria-label="Link to Search volume analysis">#</a></article><article class="gl-term b3" id="keyword-difficulty-scoring" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Keyword difficulty scoring</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Keyword difficulty (KD) is a tool&#x27;s estimate, usually 0 to 100, of how hard it would be to reach page one for a keyword. Most tools calculate it mostly from the backlink strength of the currently ranking pages.</p><p class="gl-ex"><strong>Example:</strong> a new site with little authority should target KD 0 to 20 terms first and build up, rather than chasing &quot;life insurance&quot; at KD 95.</p><p class="gl-why"><strong>Why 5:</strong> a useful rough filter. It ignores content quality, intent fit, and your own topical authority, and each tool calculates it differently, so a manual SERP review is more reliable.</p><a class="gl-perma" href="#keyword-difficulty-scoring" aria-label="Link to Keyword difficulty scoring">#</a></article><article class="gl-term b4" id="long-tail-keywords" data-term="" data-s="7"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Long-tail keywords</h3><span class="gl-sc" aria-label="Impact score 7 out of 10"><b>7</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><p class="gl-def">Long-tail keywords are longer, more specific queries with lower individual volume: &quot;standing seam metal roof cost per square foot in Kentucky&quot; rather than &quot;metal roof.&quot; Collectively they make up the majority of all searches, and they convert better because the searcher&#x27;s need is clearer.</p><p class="gl-ex"><strong>Analogy:</strong> the main aisle of a bookstore holds bestsellers everyone fights over; the long tail is the thousands of niche titles that, added together, sell more.</p><p class="gl-ex">AI-era note: prompts typed into ChatGPT and Google AI Mode are much longer than classic searches, so long-tail, conversational coverage maps directly onto how people now ask AI.</p><p class="gl-why"><strong>Why 7:</strong> the most realistic path for newer sites, higher conversion, and strong alignment with conversational AI queries.</p><a class="gl-perma" href="#long-tail-keywords" aria-label="Link to Long-tail keywords">#</a></article><article class="gl-term b4" id="keyword-clustering-topic-grouping" data-term="" data-s="7"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Keyword clustering / topic grouping</h3><span class="gl-sc" aria-label="Impact score 7 out of 10"><b>7</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><p class="gl-def">Keyword clustering groups keywords that can be satisfied by the same page, usually by checking whether Google shows the same URLs for them. This decides how many pages to build and which keywords each page targets.</p><p class="gl-ex"><strong>Example:</strong> &quot;metal roof cost,&quot; &quot;how much is a metal roof,&quot; and &quot;metal roofing price per square&quot; share the same top results, so one page covers all three. &quot;Metal roof vs shingles&quot; has different results and needs its own page.</p><p class="gl-why"><strong>Why 7:</strong> prevents both thin duplicate pages and overstuffed single pages. It is the bridge from a keyword list to a sound site architecture.</p><a class="gl-perma" href="#keyword-clustering-topic-grouping" aria-label="Link to Keyword clustering / topic grouping">#</a></article><article class="gl-term b3" id="competitor-keyword-gap-analysis" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Competitor keyword gap analysis</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Gap analysis compares the keywords your competitors rank for with the keywords you rank for, revealing topics you are missing. Tools like Semrush&#x27;s Keyword Gap automate this.</p><p class="gl-ex"><strong>Example:</strong> three competing law firms rank for &quot;what happens at a deposition&quot; and &quot;how long does a personal injury case take&quot;; your firm ranks for neither, so those become content priorities.</p><p class="gl-why"><strong>Why 6:</strong> a fast, data-backed way to find proven opportunities. It only shows what competitors already do, so pair it with original ideas.</p><a class="gl-perma" href="#competitor-keyword-gap-analysis" aria-label="Link to Competitor keyword gap analysis">#</a></article><article class="gl-term b2" id="seasonal-trending-keywords" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Seasonal / trending keywords</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Seasonal keywords spike at predictable times (&quot;furnace repair&quot; in November, &quot;pool opening&quot; in May). Trending keywords spike unpredictably around news or culture. Google Trends shows both.</p><p class="gl-ex"><strong>Example:</strong> publishing a &quot;how to prepare your HVAC for winter&quot; guide in August gives it time to be indexed and ranked before October demand.</p><p class="gl-why"><strong>Why 4:</strong> very important for some businesses (retail, travel, tax, HVAC) and minor for others. Timing content ahead of peaks is the key skill.</p><a class="gl-perma" href="#seasonal-trending-keywords" aria-label="Link to Seasonal / trending keywords">#</a></article><article class="gl-term b4" id="question-based-keywords-paa-mining" data-term="" data-s="7"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Question-based keywords (PAA mining)</h3><span class="gl-sc" aria-label="Impact score 7 out of 10"><b>7</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><p class="gl-def">These are the questions people ask about a topic, mined from Google&#x27;s &quot;People Also Ask&quot; boxes, autocomplete, forums, Reddit, AlsoAsked, and sales or support calls.</p><p class="gl-ex"><strong>Example:</strong> PAA for &quot;metal roof&quot; includes &quot;Do metal roofs make your house hotter?&quot; and &quot;Do metal roofs attract lightning?&quot; Answering them directly on the page captures those queries and the objections buyers actually have.</p><p class="gl-why"><strong>Why 7:</strong> questions map almost one-to-one to how people prompt LLMs and how AI Overviews structure answers. Direct question-and-answer coverage is one of the most transferable SEO and AEO skills.</p><a class="gl-perma" href="#question-based-keywords-paa-mining" aria-label="Link to Question-based keywords (PAA mining)">#</a></article><article class="gl-term b3" id="zero-volume-keywords" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Zero-volume keywords</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Zero-volume keywords are terms that tools report as having no measurable search volume, often because the data samples are too small or the query is new. Many still get real searches, especially specific, high-intent B2B or niche queries.</p><p class="gl-ex"><strong>Example:</strong> &quot;HIPAA compliant scheduling software for chiropractors&quot; might show 0 volume yet bring in the exact buyers a niche SaaS needs. Customers and sales calls are the best source of these terms.</p><p class="gl-why"><strong>Why 5:</strong> high conversion, low competition, and well-matched to the specific prompts people give LLMs. Easy wins that competitors relying only on tools miss.</p><a class="gl-perma" href="#zero-volume-keywords" aria-label="Link to Zero-volume keywords">#</a></article><article class="gl-term b3" id="keyword-cannibalization-detection" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Keyword cannibalization detection</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Cannibalization happens when several of your pages target the same query and intent, so Google alternates between them or ranks neither well. Detection uses Search Console (multiple URLs receiving impressions for the same query) or rank tracking.</p><p class="gl-ex"><strong>Analogy:</strong> two of your own salespeople pitching the same client with different prices. The client trusts neither.</p><p class="gl-ex"><strong>Example:</strong> a blog with &quot;Best Running Shoes 2024,&quot; &quot;Best Running Shoes 2025,&quot; and &quot;Top Running Shoes&quot; competes with itself. Merging into one updated page usually lifts rankings.</p><p class="gl-why"><strong>Why 5:</strong> fixing true cannibalization can produce quick gains, but it is often over-diagnosed; two pages ranking for one query is fine when they serve different intents.</p><a class="gl-perma" href="#keyword-cannibalization-detection" aria-label="Link to Keyword cannibalization detection">#</a></article><article class="gl-term b3" id="serp-feature-analysis-per-keyword" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">SERP feature analysis per keyword</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">This is checking which features appear in the results for each target keyword (AI Overview, featured snippet, People Also Ask, local pack, video carousel, shopping results, images) and how far down the first organic result sits.</p><p class="gl-ex"><strong>Example:</strong> a keyword where an AI Overview, four ads, and a map pack sit above the first organic result may deliver a fraction of the clicks its volume suggests. A keyword with a video carousel means you need a video, not just an article.</p><p class="gl-why"><strong>Why 6:</strong> directly shapes what content format to build and how much traffic is realistically available, which matters more each year as AI Overviews absorb clicks.</p><a class="gl-perma" href="#serp-feature-analysis-per-keyword" aria-label="Link to SERP feature analysis per keyword">#</a></article></div></div></section><section class="gl-sec" id="content-strategy" data-spy="" aria-labelledby="content-strategy-h"><div class="wrap gl-sgrid"><aside class="gl-aside"><div class="gl-stick"><div class="gl-snum"><b>05</b><span>11 terms</span></div><h2 class="gl-sh" id="content-strategy-h">Content Strategy</h2><p class="gl-sintro">Content strategy is where SEO and AEO converge most. Topical authority and information gain are the two highest-impact ideas in this whole document for the AI era: Google rewards sites that own a subject, and LLMs cite sources that add something no one else has.</p><div class="gl-rbox"><span class="e-eb">Ranked by impact</span><ol class="gl-rank"><li class="b5" data-for="topical-authority-building"><a href="#topical-authority-building"><span class="gl-rn">Topical authority building</span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b5" data-for="information-gain-original-data"><a href="#information-gain-original-data"><span class="gl-rn">Information gain / original data</span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b4" data-for="content-hubs-pillar-pages-clusters"><a href="#content-hubs-pillar-pages-clusters"><span class="gl-rn">Content hubs / pillar pages / clusters</span><span class="gl-rb" aria-hidden="true"><i style="width: 70%"></i></span><b>7</b></a></li><li class="b4" data-for="content-refreshing"><a href="#content-refreshing"><span class="gl-rn">Content refreshing</span><span class="gl-rb" aria-hidden="true"><i style="width: 70%"></i></span><b>7</b></a></li><li class="b4" data-for="content-formats-guides-listicles-comparisons-tools"><a href="#content-formats-guides-listicles-comparisons-tools"><span class="gl-rn">Content formats (guides, listicles, comparisons, tools)</span><span class="gl-rb" aria-hidden="true"><i style="width: 70%"></i></span><b>7</b></a></li><li class="b3" data-for="content-gap-analysis"><a href="#content-gap-analysis"><span class="gl-rn">Content gap analysis</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="content-pruning-consolidation"><a href="#content-pruning-consolidation"><span class="gl-rn">Content pruning / consolidation</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="author-bios-entity-building"><a href="#author-bios-entity-building"><span class="gl-rn">Author bios / entity building</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="programmatic-seo"><a href="#programmatic-seo"><span class="gl-rn">Programmatic SEO</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b3" data-for="user-generated-content"><a href="#user-generated-content"><span class="gl-rn">User-generated content</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b2" data-for="content-briefs-sop-creation"><a href="#content-briefs-sop-creation"><span class="gl-rn">Content briefs / SOP creation</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li></ol><button type="button" class="gl-more" aria-expanded="false">Show all 11</button></div></div></aside><div class="gl-terms"><article class="gl-term b5" id="topical-authority-building" data-term="" data-s="9"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Topical authority building</h3><span class="gl-sc" aria-label="Impact score 9 out of 10"><b>9</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span><p class="gl-def">Topical authority is the perception, by Google and by LLMs, that your site is a go-to expert on a subject. It is built by covering a topic thoroughly and consistently over time (the core concepts, the subtopics, the comparisons, the beginner and advanced questions) rather than publishing scattered posts on unrelated subjects.</p><p class="gl-ex"><strong>Analogy:</strong> a general store versus a specialist shop. If you want a rare fishing lure, you trust the tackle shop that stocks 2,000 lures over the supermarket with a small rack.</p><p class="gl-ex"><strong>Example:</strong> a site with 80 interlinked, high-quality articles on home solar (costs, incentives by state, battery storage, panel comparisons, installer questions) will often outrank a high-authority general publication for new solar queries.</p><p class="gl-why"><strong>Why 9:</strong> Google&#x27;s systems increasingly favor focused, demonstrably expert sites, and LLMs associate brands with the topics they cover most consistently.</p><a class="gl-perma" href="#topical-authority-building" aria-label="Link to Topical authority building">#</a></article><article class="gl-term b4" id="content-hubs-pillar-pages-clusters" data-term="" data-s="7"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Content hubs / pillar pages / clusters</h3><span class="gl-sc" aria-label="Impact score 7 out of 10"><b>7</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><p class="gl-def">This is the structural model for topical authority. A pillar page covers a broad topic comprehensively (&quot;Complete Guide to Home Solar&quot;). Cluster pages go deep on subtopics (&quot;Solar Tax Credit Explained,&quot; &quot;Best Solar Batteries&quot;). All clusters link to the pillar and the pillar links to each, forming a hub.</p><p class="gl-ex"><strong>Analogy:</strong> a wheel with a hub and spokes. The structure makes the relationship between pages obvious to readers and crawlers alike.</p><p class="gl-why"><strong>Why 7:</strong> an effective way to organize internal linking and coverage. The model is a means, not the goal; the score is lower than topical authority because the structure without the quality does little.</p><a class="gl-perma" href="#content-hubs-pillar-pages-clusters" aria-label="Link to Content hubs / pillar pages / clusters">#</a></article><article class="gl-term b3" id="content-gap-analysis" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Content gap analysis</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Content gap analysis finds topics, questions, and formats your audience wants that your site does not cover. Inputs include competitor gap analysis, PAA questions, customer support tickets, sales calls, forums, and AI prompt testing (asking ChatGPT and Perplexity your buyers&#x27; questions and seeing whose content is cited).</p><p class="gl-ex"><strong>Example:</strong> a B2B software company discovers prospects constantly ask &quot;how does this integrate with QuickBooks?&quot; but there is no page answering it. Creating one captures searches and AI citations for that exact question.</p><p class="gl-why"><strong>Why 6:</strong> consistently produces high-value topics. Its value depends on executing what it finds.</p><a class="gl-perma" href="#content-gap-analysis" aria-label="Link to Content gap analysis">#</a></article><article class="gl-term b3" id="content-pruning-consolidation" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Content pruning / consolidation</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Pruning removes or noindexes content that is outdated, thin, or irrelevant. Consolidation merges several weak, overlapping pages into one strong page with 301 redirects. The idea is that low-quality pages can drag down how Google evaluates your whole site.</p><p class="gl-ex"><strong>Analogy:</strong> pruning a fruit tree. Cutting weak branches sends energy to the strong ones.</p><p class="gl-ex"><strong>Example:</strong> a blog with 600 posts, 400 of which get zero traffic, merges 120 overlapping posts into 30 thorough guides and deletes 150 obsolete announcements; organic traffic rises over the next quarter.</p><p class="gl-why"><strong>Why 6:</strong> often produces real gains on large, older sites affected by helpful-content and core updates. Must be done carefully, since deleting pages with backlinks or long-tail traffic can backfire.</p><a class="gl-perma" href="#content-pruning-consolidation" aria-label="Link to Content pruning / consolidation">#</a></article><article class="gl-term b4" id="content-refreshing" data-term="" data-s="7"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Content refreshing</h3><span class="gl-sc" aria-label="Impact score 7 out of 10"><b>7</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><p class="gl-def">Refreshing means substantively updating existing pages: new data, current prices, new sections answering newer questions, improved examples, removed outdated information. It differs from pruning in that the page stays and improves.</p><p class="gl-ex"><strong>Example:</strong> an article that slipped from position 3 to position 11 over 18 months is updated with 2026 data and two new sections; within weeks it climbs back to the top five.</p><p class="gl-why"><strong>Why 7:</strong> often the highest-ROI content activity, because the page already has authority and links. AI search tools also strongly prefer recently updated sources.</p><a class="gl-perma" href="#content-refreshing" aria-label="Link to Content refreshing">#</a></article><article class="gl-term b4" id="content-formats-guides-listicles-comparisons-tools" data-term="" data-s="7"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Content formats (guides, listicles, comparisons, tools)</h3><span class="gl-sc" aria-label="Impact score 7 out of 10"><b>7</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><p class="gl-def">Format is the shape the content takes: how-to guides, listicles (&quot;10 best...&quot;), comparison pages (&quot;X vs Y&quot;), templates, calculators, interactive tools, original research, case studies, glossaries, and videos. The right format is the one Google and users already reward for that query.</p><p class="gl-ex"><strong>Example:</strong> &quot;mortgage calculator&quot; demands a working calculator, not an article about calculators. &quot;HubSpot vs Salesforce&quot; demands a comparison table. &quot;Best CRM&quot; demands a list with clear picks.</p><p class="gl-why"><strong>Why 7:</strong> format mismatch is a common reason pages fail. Comparisons and &quot;best of&quot; lists are also among the content types LLMs cite most often for commercial questions.</p><a class="gl-perma" href="#content-formats-guides-listicles-comparisons-tools" aria-label="Link to Content formats (guides, listicles, comparisons, tools)">#</a></article><article class="gl-term b3" id="programmatic-seo" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Programmatic SEO</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Programmatic SEO creates many pages from a template and a dataset: &quot;[service] in [city],&quot; &quot;[tool A] vs [tool B],&quot; &quot;[currency] to [currency] converter,&quot; &quot;flights from [city] to [city].&quot; Done well, each page has unique, useful data. Done badly, it is thousands of near-identical pages, which Google&#x27;s scaled-content-abuse policy targets.</p><p class="gl-ex"><strong>Example:</strong> Zillow&#x27;s property pages, Tripadvisor&#x27;s &quot;things to do in [city],&quot; and Wise&#x27;s currency pages are successful programmatic SEO because each page has genuinely unique data. A site generating 5,000 city pages that only swap the city name is not.</p><p class="gl-why"><strong>Why 5:</strong> enormous upside for businesses with real proprietary data, and real penalty risk for those without. The average outcome across all attempts is modest.</p><a class="gl-perma" href="#programmatic-seo" aria-label="Link to Programmatic SEO">#</a></article><article class="gl-term b3" id="user-generated-content" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">User-generated content</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">User-generated content (UGC) is content created by users: reviews, Q&amp;A, comments, forum posts, community answers, photos. It adds fresh, authentic, long-tail language and first-hand experience that a brand cannot write itself.</p><p class="gl-ex"><strong>Example:</strong> an e-commerce product page with 300 customer reviews ranks for queries like &quot;does [product] run small&quot; because customers used those exact words. Reddit&#x27;s massive visibility gains in Google since 2023 are the most dramatic example of UGC value.</p><p class="gl-why"><strong>Why 5:</strong> valuable where a community exists, but it requires moderation (spam, low-quality posts) and takes time to build.</p><a class="gl-perma" href="#user-generated-content" aria-label="Link to User-generated content">#</a></article><article class="gl-term b3" id="author-bios-entity-building" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Author bios / entity building</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Author bios show who wrote the content and why they are qualified: credentials, experience, photo, links to their other work and profiles. Entity building goes further, establishing the author (and the company) as a recognized entity that Google and LLMs can connect across the web, through consistent names, Person schema with sameAs links, LinkedIn profiles, speaking, and bylines elsewhere.</p><p class="gl-ex"><strong>Example:</strong> a medical article written by &quot;Admin&quot; versus one by a named, board-certified physician with a bio linking to her hospital profile. Quality raters, and increasingly algorithms, treat these very differently.</p><p class="gl-why"><strong>Why 6:</strong> central for health, finance, legal, and other high-stakes (&quot;Your Money or Your Life&quot;) topics, lower elsewhere. It supports E-E-A-T and helps LLMs attribute expertise.</p><a class="gl-perma" href="#author-bios-entity-building" aria-label="Link to Author bios / entity building">#</a></article><article class="gl-term b5" id="information-gain-original-data" data-term="" data-s="9"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Information gain / original data</h3><span class="gl-sc" aria-label="Impact score 9 out of 10"><b>9</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span><p class="gl-def">Information gain is the amount of new information a page adds beyond what already ranks: original research, proprietary data, first-hand testing, unique expert insight, real photos, case studies with numbers. Google holds a patent on scoring information gain, and its helpful-content guidance asks whether content provides original information, reporting, research, or analysis.</p><p class="gl-ex"><strong>Analogy:</strong> if ten articles all summarize the same three sources, an eleventh summary adds nothing. The article that ran its own experiment is the one everyone else ends up citing.</p><p class="gl-ex"><strong>Example:</strong> instead of &quot;How Long Do Tires Last?&quot; rehashed from manufacturer claims, a tire shop publishes data from 12,000 tire replacements showing actual mileage by brand. Journalists link to it, competitors cite it, and LLMs quote its numbers.</p><p class="gl-why"><strong>Why 9:</strong> this is the antidote to AI-generated sameness. It earns links naturally, earns LLM citations (models need sources for specific facts), and is very hard for competitors to copy.</p><a class="gl-perma" href="#information-gain-original-data" aria-label="Link to Information gain / original data">#</a></article><article class="gl-term b2" id="content-briefs-sop-creation" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Content briefs / SOP creation</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">A content brief is a document given to a writer before writing: target keyword and intent, audience, required subtopics and questions, competing pages, internal links, unique angle, and expert sources. SOPs (standard operating procedures) document the repeatable process for briefs, writing, editing, optimization, and publishing.</p><p class="gl-ex"><strong>Example:</strong> a brief that specifies &quot;include our 2025 install-cost data, answer the five PAA questions, and link to the financing page&quot; produces far better first drafts than &quot;write 1,500 words about metal roofs.&quot;</p><p class="gl-why"><strong>Why 4:</strong> an enabler of quality and consistency at scale. The impact is real but flows through other variables.</p><a class="gl-perma" href="#content-briefs-sop-creation" aria-label="Link to Content briefs / SOP creation">#</a></article></div></div></section><section class="gl-sec gl-alt" id="local-seo" data-spy="" aria-labelledby="local-seo-h"><div class="wrap gl-sgrid"><aside class="gl-aside"><div class="gl-stick"><div class="gl-snum"><b>06</b><span>10 terms</span></div><h2 class="gl-sh" id="local-seo-h">Local SEO</h2><p class="gl-sintro">Local scores assume a business that serves customers in a specific area (contractors, clinics, restaurants, law firms, retail stores); for a national e-commerce or SaaS site, most of these drop near 0. For local businesses, Google Business Profile and reviews are the two biggest levers, and they also feed the answers ChatGPT, Gemini, and Apple Maps give to &quot;near me&quot; questions.</p><div class="gl-rbox"><span class="e-eb">Ranked by impact</span><ol class="gl-rank"><li class="b5" data-for="google-business-profile-optimization"><a href="#google-business-profile-optimization"><span class="gl-rn">Google Business Profile optimization</span><span class="gl-rb" aria-hidden="true"><i style="width: 100%"></i></span><b>10</b></a></li><li class="b5" data-for="review-generation-and-management"><a href="#review-generation-and-management"><span class="gl-rn">Review generation &amp; management</span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b4" data-for="local-pack-map-pack-ranking"><a href="#local-pack-map-pack-ranking"><span class="gl-rn">Local pack / map pack ranking</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4" data-for="proximity-relevance-prominence-signals"><a href="#proximity-relevance-prominence-signals"><span class="gl-rn">Proximity / relevance / prominence signals</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4" data-for="location-pages-service-area-pages"><a href="#location-pages-service-area-pages"><span class="gl-rn">Location pages / service area pages</span><span class="gl-rb" aria-hidden="true"><i style="width: 70%"></i></span><b>7</b></a></li><li class="b3" data-for="local-link-building"><a href="#local-link-building"><span class="gl-rn">Local link building</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="nap-consistency-name-address-phone"><a href="#nap-consistency-name-address-phone"><span class="gl-rn">NAP consistency (Name, Address, Phone)</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b3" data-for="geo-targeted-content"><a href="#geo-targeted-content"><span class="gl-rn">Geo-targeted content</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b2" data-for="local-citations-directories"><a href="#local-citations-directories"><span class="gl-rn">Local citations / directories</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li><li class="b2" data-for="local-schema-markup"><a href="#local-schema-markup"><span class="gl-rn">Local schema markup</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li></ol><button type="button" class="gl-more" aria-expanded="false">Show all 10</button></div></div></aside><div class="gl-terms"><article class="gl-term b5" id="google-business-profile-optimization" data-term="" data-s="10"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Google Business Profile optimization</h3><span class="gl-sc" aria-label="Impact score 10 out of 10"><b>10</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><p class="gl-def">Google Business Profile (GBP, formerly Google My Business) is the free listing that appears in Google Maps and the local &quot;map pack.&quot; Optimization means choosing the most accurate primary category (the single most important field), adding secondary categories, services, products, accurate hours, high-quality photos, a description, attributes, Q&amp;A, and regular posts, and verifying the listing.</p><p class="gl-ex"><strong>Analogy:</strong> GBP is your storefront on Google&#x27;s main street. Many customers decide based on it alone, without ever visiting your website.</p><p class="gl-ex"><strong>Example:</strong> a dentist who changes the primary category from &quot;Dentist&quot; to the more specific &quot;Cosmetic Dentist&quot; (when accurate) may suddenly rank for veneer and whitening searches. Primary category changes are among the fastest-acting local tweaks.</p><p class="gl-why"><strong>Why 10:</strong> for local businesses, the map pack often captures more clicks and calls than the organic results, and the GBP is the asset that ranks there. Gemini and Google AI Mode also lean heavily on GBP data for local answers.</p><a class="gl-perma" href="#google-business-profile-optimization" aria-label="Link to Google Business Profile optimization">#</a></article><article class="gl-term b3" id="nap-consistency-name-address-phone" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">NAP consistency (Name, Address, Phone)</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">NAP consistency means your business name, address, and phone number appear identically across your website, GBP, directories, social profiles, and data aggregators. Inconsistencies (old addresses, tracking numbers, &quot;St.&quot; vs &quot;Street&quot; is fine, but different suite numbers or old phone numbers are not) confuse search engines about which entity is which.</p><p class="gl-ex"><strong>Example:</strong> a business that moved in 2021 still listed at the old address on Yelp, Bing Places, and Apple Business Connect may see map rankings split or suppressed, and customers drive to the wrong place.</p><p class="gl-why"><strong>Why 5:</strong> it used to be a major factor. Google is now much better at resolving entities, so consistency is more hygiene than lever. Major errors (wrong address, wrong phone on big platforms) still matter, especially since LLMs pull business details from these sources.</p><a class="gl-perma" href="#nap-consistency-name-address-phone" aria-label="Link to NAP consistency (Name, Address, Phone)">#</a></article><article class="gl-term b2" id="local-citations-directories" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Local citations / directories</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Citations are listings of your business on other sites: Yelp, Bing Places, Apple Business Connect, Facebook, BBB, Angi, Healthgrades, Avvo, chamber of commerce, and industry or city directories. They confirm your existence and details.</p><p class="gl-ex"><strong>Example:</strong> a plumber listed on the top 30 general and home-services directories has a solid foundation. Being listed on 300 low-quality directories adds nothing.</p><p class="gl-why"><strong>Why 4:</strong> a core set of accurate, high-quality citations matters, especially Apple and Bing (which feed Siri, Apple Maps, ChatGPT, and Copilot). Beyond that core, returns diminish quickly.</p><a class="gl-perma" href="#local-citations-directories" aria-label="Link to Local citations / directories">#</a></article><article class="gl-term b5" id="review-generation-and-management" data-term="" data-s="9"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Review generation &amp; management</h3><span class="gl-sc" aria-label="Impact score 9 out of 10"><b>9</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span><p class="gl-def">This means systematically asking happy customers to leave reviews (on Google first, then relevant platforms), responding to all reviews professionally, and handling negative reviews constructively. Review count, rating, recency, and the words customers use all influence local rankings and conversions. Buying fake reviews or &quot;review gating&quot; (only asking happy customers through a filter) violates Google and FTC rules.</p><p class="gl-ex"><strong>Analogy:</strong> reviews are word-of-mouth made visible to strangers. A 4.8 rating with 400 recent reviews beats a 5.0 with six reviews from 2022.</p><p class="gl-ex"><strong>Example:</strong> an auto shop that texts a review link after every service grows from 40 to 350 Google reviews in a year; reviews that mention &quot;brake repair&quot; and &quot;Lexington&quot; help it rank for those searches.</p><p class="gl-why"><strong>Why 9:</strong> a top local ranking factor, the top conversion factor, and a heavy input into how LLMs describe and recommend local businesses (&quot;highly rated for...&quot;).</p><a class="gl-perma" href="#review-generation-and-management" aria-label="Link to Review generation &amp; management">#</a></article><article class="gl-term b3" id="local-link-building" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Local link building</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Local link building is earning links from locally relevant websites: local news, chambers of commerce, sponsorships of youth sports or charity events, local business associations, local bloggers, universities, and partner businesses.</p><p class="gl-ex"><strong>Example:</strong> sponsoring a 5K race earns a link from the race website and a mention in the local paper. A link from the city&#x27;s Little League site may be low &quot;authority&quot; by tool metrics but is a strong local relevance signal.</p><p class="gl-why"><strong>Why 6:</strong> links help local organic rankings and map pack prominence, and local news mentions feed LLM knowledge. Local links are also less competitive to earn than national ones.</p><a class="gl-perma" href="#local-link-building" aria-label="Link to Local link building">#</a></article><article class="gl-term b4" id="location-pages-service-area-pages" data-term="" data-s="7"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Location pages / service area pages</h3><span class="gl-sc" aria-label="Impact score 7 out of 10"><b>7</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><p class="gl-def">Location pages are dedicated pages for each physical location (address, hours, staff, directions, local reviews). Service area pages target cities or neighborhoods a business serves without having an office there. Each needs genuinely unique, local content to avoid being thin duplicates.</p><p class="gl-ex"><strong>Example:</strong> a roofing company serving Lexington, Georgetown, and Richmond creates three pages, each with local project photos, testimonials from that city, permit information, and weather-specific roofing advice. A template that only swaps the city name rarely ranks.</p><p class="gl-why"><strong>Why 7:</strong> the main way to rank organically in cities beyond your office address, and they give LLMs clear evidence of where you operate.</p><a class="gl-perma" href="#location-pages-service-area-pages" aria-label="Link to Location pages / service area pages">#</a></article><article class="gl-term b4" id="local-pack-map-pack-ranking" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Local pack / map pack ranking</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">The local pack is the block of three businesses with a map that appears for local-intent searches (&quot;dentist near me,&quot; &quot;roofers Lexington&quot;). Ranking there depends on GBP optimization, reviews, proximity, links, citations, and on-site signals. As a variable, it means actively tracking and optimizing your map visibility across the area you serve, often with grid-based rank trackers that show rankings from different points in the city.</p><p class="gl-ex"><strong>Example:</strong> a geo-grid scan shows a business ranks #1 within a mile of its office but drops off the pack three miles away, which guides where to build location content, links, and reviews.</p><p class="gl-why"><strong>Why 8:</strong> for local businesses it is often the single most valuable placement in search, ahead of the organic results below it.</p><a class="gl-perma" href="#local-pack-map-pack-ranking" aria-label="Link to Local pack / map pack ranking">#</a></article><article class="gl-term b3" id="geo-targeted-content" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Geo-targeted content</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Geo-targeted content is content written for a specific locality: local guides, cost data for your area, local regulations, neighborhood-specific advice, community news, and local case studies.</p><p class="gl-ex"><strong>Example:</strong> &quot;Kentucky Roof Permit Requirements by County&quot; or &quot;How Lexington&#x27;s Freeze-Thaw Cycles Affect Your Roof&quot; builds local relevance and earns local links and citations.</p><p class="gl-why"><strong>Why 5:</strong> strengthens local relevance and creates content national competitors cannot match. A supporting lever rather than a primary one.</p><a class="gl-perma" href="#geo-targeted-content" aria-label="Link to Geo-targeted content">#</a></article><article class="gl-term b2" id="local-schema-markup" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Local schema markup</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Local schema is LocalBusiness structured data (or a more specific subtype like Dentist, Plumber, or Restaurant) on your website, describing name, address, phone, hours, geo-coordinates, service area, and links to your profiles via sameAs.</p><p class="gl-ex"><strong>Example:</strong> a law firm adds LegalService schema on each office page, linking to its GBP, Avvo, and LinkedIn profiles.</p><p class="gl-why"><strong>Why 4:</strong> helps search engines and AI systems confirm business details and connect your site to your GBP entity. Not a strong ranking factor on its own.</p><a class="gl-perma" href="#local-schema-markup" aria-label="Link to Local schema markup">#</a></article><article class="gl-term b4" id="proximity-relevance-prominence-signals" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Proximity / relevance / prominence signals</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">Google states that local rankings are based on three factors. Proximity: how close the business is to the searcher or the location in the query. Relevance: how well the business matches what was searched (categories, services, website content, reviews). Prominence: how well-known and trusted the business is (reviews, links, mentions, overall web presence).</p><p class="gl-ex"><strong>Analogy:</strong> when you ask a friend for a good pizza place, they weigh how close it is, whether it actually serves the pizza you want, and how much people rave about it.</p><p class="gl-ex"><strong>Example:</strong> you cannot move your building, so proximity is mostly fixed. Relevance (categories, service pages) and prominence (reviews, local PR, links) are where effort goes.</p><p class="gl-why"><strong>Why 8:</strong> this is the framework every other local variable feeds. Proximity often dominates the map pack, so prominence and relevance work determines how far your radius extends.</p><a class="gl-perma" href="#proximity-relevance-prominence-signals" aria-label="Link to Proximity / relevance / prominence signals">#</a></article></div></div></section><section class="gl-sec" id="ai-search" data-spy="" aria-labelledby="ai-search-h"><div class="wrap gl-sgrid"><aside class="gl-aside"><div class="gl-stick"><div class="gl-snum"><b>07</b><span>12 terms</span></div><h2 class="gl-sh" id="ai-search-h">GEO / AI Search Optimization</h2><p class="gl-sintro">GEO (generative engine optimization), also called AEO or AI search optimization, is about being retrieved, cited, and recommended by AI systems. LLMs answer in two ways: from what they learned in training (shaped by how often and how consistently the web talks about you) and from live retrieval (a search engine fetches pages, and the model quotes the clearest, most trustworthy passages). Being mentioned widely and being easy to quote are what move the needle; shortcut files and manipulation do not.</p><div class="gl-rbox"><span class="e-eb">Ranked by impact</span><ol class="gl-rank"><li class="b5" data-for="brand-mention-frequency-across-the-web"><a href="#brand-mention-frequency-across-the-web"><span class="gl-rn">Brand mention frequency across the web</span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b4" data-for="llm-citation-optimization-chatgpt-claude-perplexity-gemini"><a href="#llm-citation-optimization-chatgpt-claude-perplexity-gemini"><span class="gl-rn">LLM citation optimization (ChatGPT, Claude, Perplexity, Gemini)</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4" data-for="ai-overviews-optimization"><a href="#ai-overviews-optimization"><span class="gl-rn">AI Overviews optimization</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4" data-for="entity-optimization-knowledge-graph-presence"><a href="#entity-optimization-knowledge-graph-presence"><span class="gl-rn">Entity optimization / knowledge graph presence</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4" data-for="structured-extractable-content-formatting"><a href="#structured-extractable-content-formatting"><span class="gl-rn">Structured, extractable content formatting</span><span class="gl-rb" aria-hidden="true"><i style="width: 70%"></i></span><b>7</b></a></li><li class="b4" data-for="reddit-forum-visibility-llm-training-sources"><a href="#reddit-forum-visibility-llm-training-sources"><span class="gl-rn">Reddit / forum visibility (LLM training sources)</span><span class="gl-rb" aria-hidden="true"><i style="width: 70%"></i></span><b>7</b></a></li><li class="b4" data-for="answer-first-content-structure"><a href="#answer-first-content-structure"><span class="gl-rn">Answer-first content structure</span><span class="gl-rb" aria-hidden="true"><i style="width: 70%"></i></span><b>7</b></a></li><li class="b3" data-for="statistics-quotable-data-inclusion"><a href="#statistics-quotable-data-inclusion"><span class="gl-rn">Statistics / quotable data inclusion</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="wikipedia-wikidata-presence"><a href="#wikipedia-wikidata-presence"><span class="gl-rn">Wikipedia / Wikidata presence</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b1" data-for="consensus-manufacturing"><a href="#consensus-manufacturing"><span class="gl-rn">Consensus manufacturing</span><span class="gl-rb" aria-hidden="true"><i style="width: 20%"></i></span><b>2</b></a></li><li class="b1" data-for="parasite-seo"><a href="#parasite-seo"><span class="gl-rn">Parasite SEO</span><span class="gl-rb" aria-hidden="true"><i style="width: 20%"></i></span><b>2</b></a></li><li class="b1" data-for="llms-txt"><a href="#llms-txt"><span class="gl-rn">llms.txt</span><span class="gl-rb" aria-hidden="true"><i style="width: 10%"></i></span><b>1</b></a></li></ol><button type="button" class="gl-more" aria-expanded="false">Show all 12</button></div></div></aside><div class="gl-terms"><article class="gl-term b4" id="llm-citation-optimization-chatgpt-claude-perplexity-gemini" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">LLM citation optimization (ChatGPT, Claude, Perplexity, Gemini)</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">This is the umbrella practice of increasing how often AI assistants cite your pages as sources or name your brand in answers. It combines being indexed by the search engines these tools rely on (Bing for ChatGPT and Copilot, Google for Gemini, plus each provider&#x27;s own search partners and crawlers), allowing AI crawlers, writing quotable passages, and being widely referenced by trusted third parties. It is measured by running prompts your buyers would ask and tracking which sources and brands appear.</p><p class="gl-ex"><strong>Analogy:</strong> an LLM is a research assistant with a deadline. It grabs a few sources that look credible and easy to quote, then writes. You want to be on its desk and easy to excerpt.</p><p class="gl-ex"><strong>Example:</strong> a B2B payroll company tracks 50 buyer prompts monthly (&quot;best payroll software for restaurants&quot;) and finds it is mentioned in 6 of 50. It finds the cited sources are mostly G2, Reddit, and three review sites, then focuses on reviews and inclusion on those sites; mentions climb to 21 of 50.</p><p class="gl-why"><strong>Why 8:</strong> AI assistants are a fast-growing discovery channel with high-intent users. The score is not 10 because most of the work happens through other variables (mentions, content quality, crawlability).</p><a class="gl-perma" href="#llm-citation-optimization-chatgpt-claude-perplexity-gemini" aria-label="Link to LLM citation optimization (ChatGPT, Claude, Perplexity, Gemini)">#</a></article><article class="gl-term b4" id="ai-overviews-optimization" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">AI Overviews optimization</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">AI Overviews are the AI-generated summaries at the top of many Google results, with linked source cards; AI Mode is Google&#x27;s fully conversational search tab. Optimization means being among the cited sources. Google uses &quot;query fan-out,&quot; breaking a query into related sub-questions and retrieving pages for each, so pages that clearly answer specific sub-questions get pulled in. Cited pages do not always rank in the top 10; one 2026 Ahrefs analysis found only 38 percent did.</p><p class="gl-ex"><strong>Example:</strong> for &quot;is a heat pump worth it in Kentucky,&quot; the overview may cite one page for efficiency in cold climates, another for local electricity rates, and a third for installation costs. Each is a separate opportunity.</p><p class="gl-why"><strong>Why 8:</strong> AI Overviews appear on a large share of informational queries and absorb many of the clicks; being cited is now the main way to stay visible on those queries.</p><a class="gl-perma" href="#ai-overviews-optimization" aria-label="Link to AI Overviews optimization">#</a></article><article class="gl-term b1" id="consensus-manufacturing" data-term="" data-s="2"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Consensus manufacturing</h3><span class="gl-sc" aria-label="Impact score 2 out of 10"><b>2</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Consensus manufacturing is seeding the same claim (&quot;Brand X is the best Y&quot;) across many sources so that LLMs, which weigh agreement across sources, repeat it. The legitimate version is genuinely earning inclusion in many independent reviews, lists, and articles. The manipulative version uses fake reviews, sock-puppet Reddit and Quora accounts, self-published &quot;best of&quot; listicles ranking yourself first, and paid placements disguised as editorial.</p><p class="gl-ex"><strong>Analogy:</strong> the difference between being a restaurant everyone recommends and hiring people to stand on corners saying &quot;I hear that restaurant is great.&quot;</p><p class="gl-ex"><strong>Example:</strong> a brand creates 40 Reddit accounts to recommend itself in relevant threads. Moderators and Reddit&#x27;s spam systems ban the accounts, the threads become public examples of astroturfing, and the FTC&#x27;s 2024 rule on fake reviews and testimonials allows substantial civil penalties.</p><p class="gl-why"><strong>Why 2:</strong> the manipulative form can work briefly, which is why it is popular, but it is fragile, increasingly detected by AI providers and platforms, and carries legal and reputational risk. The legitimate form is scored under brand mentions (9).</p><a class="gl-perma" href="#consensus-manufacturing" aria-label="Link to Consensus manufacturing">#</a></article><article class="gl-term b1" id="parasite-seo" data-term="" data-s="2"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Parasite SEO</h3><span class="gl-sc" aria-label="Impact score 2 out of 10"><b>2</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Parasite SEO is publishing content on a high-authority third-party domain (a news site&#x27;s coupon section, a university subdomain, LinkedIn articles, Medium, a big site&#x27;s &quot;partner content&quot; section) to borrow that site&#x27;s authority and rank for terms you could not rank for yourself.</p><p class="gl-ex"><strong>Example:</strong> casino and payday-loan affiliates placing &quot;best online casinos&quot; ar
