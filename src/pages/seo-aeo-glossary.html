<span class="e-eb">How to read the scores</span>
<h2 class="e-h2" id="how-h">One score. <span class="it">Two kinds of search.</span></h2>
<p class="e-p">Each of the 122 variables gets one score from 0 to 10 for how much it moves real outcomes: ranking well in Google organic results and being cited or recommended by LLMs (ChatGPT, Claude, Perplexity, Gemini, Google AI Overviews and AI Mode).</p>
<p class="e-p">Three rules shape the numbers. First, a score reflects impact for a typical business site; a 5 for hreflang becomes a 9 for a site selling in ten countries, and those context swings are noted. Second, risky tactics are scored on expected value after penalty risk, not on their best-case upside. Third, many technical items are gatekeepers: they rarely lift rankings on their own, but failing them blocks rankings entirely, so they score high.</p>
<p class="gl-model">A useful mental model: Google and LLMs are both trying to answer one question, &quot;which source is the most trustworthy, relevant, and useful answer here?&quot; Technical SEO decides whether you are even in the room. Content and keyword work decide whether you are relevant. Links, mentions, and entity signals decide whether you are believed.</p>

<section class="gl-sec" id="technical-seo" data-spy="" aria-labelledby="technical-seo-h"><div class="wrap gl-sgrid"><aside class="gl-aside"><div class="gl-stick"><div class="gl-snum"><b>01</b><span>23 terms</span></div><h2 class="gl-sh" id="technical-seo-h">Technical SEO</h2><p class="gl-sintro">Technical SEO is the plumbing: it decides whether search engines and AI crawlers can find, fetch, render, and trust your pages. The top items here are gatekeepers (crawlability, indexability, rendering), while many others are hygiene that only matters at scale.</p><div class="gl-rbox"><span class="e-eb">Ranked by impact</span><ol class="gl-rank"><li class="b5" data-for="crawlability"><a href="#crawlability"><span class="gl-rn">Crawlability</span><span class="gl-rb" aria-hidden="true"><i style="width: 100%"></i></span><b>10</b></a></li><li class="b5" data-for="indexability"><a href="#indexability"><span class="gl-rn">Indexability</span><span class="gl-rb" aria-hidden="true"><i style="width: 100%"></i></span><b>10</b></a></li><li class="b4" data-for="site-architecture-url-structure"><a href="#site-architecture-url-structure"><span class="gl-rn">Site architecture / URL structure</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4" data-for="mobile-friendliness-responsive-design"><a href="#mobile-friendliness-responsive-design"><span class="gl-rn">Mobile-friendliness / responsive design</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4" data-for="javascript-rendering-ssr-vs-csr"><a href="#javascript-rendering-ssr-vs-csr"><span class="gl-rn">JavaScript rendering / SSR vs CSR</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4" data-for="robots-txt"><a href="#robots-txt"><span class="gl-rn">Robots.txt</span><span class="gl-rb" aria-hidden="true"><i style="width: 70%"></i></span><b>7</b></a></li><li class="b4" data-for="canonical-tags"><a href="#canonical-tags"><span class="gl-rn">Canonical tags</span><span class="gl-rb" aria-hidden="true"><i style="width: 70%"></i></span><b>7</b></a></li><li class="b4" data-for="structured-data-schema-markup-json-ld"><a href="#structured-data-schema-markup-json-ld"><span class="gl-rn">Structured data / schema markup (JSON-LD)</span><span class="gl-rb" aria-hidden="true"><i style="width: 70%"></i></span><b>7</b></a></li><li class="b3" data-for="https-ssl"><a href="#https-ssl"><span class="gl-rn">HTTPS / SSL</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="page-speed-optimization"><a href="#page-speed-optimization"><span class="gl-rn">Page speed optimization</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="duplicate-content-management"><a href="#duplicate-content-management"><span class="gl-rn">Duplicate content management</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="redirect-management-301-302-chains"><a href="#redirect-management-301-302-chains"><span class="gl-rn">Redirect management (301, 302, chains)</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="http-status-codes-error-handling-404-5xx"><a href="#http-status-codes-error-handling-404-5xx"><span class="gl-rn">HTTP status codes / error handling (404, 5xx)</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="xml-sitemaps"><a href="#xml-sitemaps"><span class="gl-rn">XML sitemaps</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b3" data-for="core-web-vitals-lcp-inp-cls"><a href="#core-web-vitals-lcp-inp-cls"><span class="gl-rn">Core Web Vitals (LCP, INP, CLS)</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b3" data-for="cdn-hosting-performance"><a href="#cdn-hosting-performance"><span class="gl-rn">CDN / hosting performance</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b2" data-for="hreflang-international-targeting"><a href="#hreflang-international-targeting"><span class="gl-rn">Hreflang / international targeting</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li><li class="b2" data-for="faceted-navigation-control"><a href="#faceted-navigation-control"><span class="gl-rn">Faceted navigation control</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li><li class="b2" data-for="image-optimization-compression-webp-lazy-loading"><a href="#image-optimization-compression-webp-lazy-loading"><span class="gl-rn">Image optimization (compression, WebP, lazy loading)</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li><li class="b2" data-for="orphan-page-detection"><a href="#orphan-page-detection"><span class="gl-rn">Orphan page detection</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li><li class="b2" data-for="pagination-handling"><a href="#pagination-handling"><span class="gl-rn">Pagination handling</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li><li class="b2" data-for="log-file-analysis"><a href="#log-file-analysis"><span class="gl-rn">Log file analysis</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li><li class="b2" data-for="crawl-budget-optimization"><a href="#crawl-budget-optimization"><span class="gl-rn">Crawl budget optimization</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li></ol><button type="button" class="gl-more" aria-expanded="false">Show all 23</button></div></div></aside><div class="gl-terms"><article class="gl-term b5" id="crawlability" data-term="" data-s="10"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Crawlability</h3><span class="gl-sc" aria-label="Impact score 10 out of 10"><b>10</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><p class="gl-def">Crawlability is whether a bot (Googlebot, Bingbot, GPTBot, ClaudeBot, PerplexityBot) can reach your pages by following links and requesting URLs without being blocked. Blockers include robots.txt disallows, login walls, links hidden inside JavaScript click events, infinite redirect loops, and firewalls or bot-protection services that challenge crawlers.</p><p class="gl-ex"><strong>Analogy:</strong> your site is a library and crawlers are inspectors. If the doors are locked or the hallways dead-end, the best books inside are never catalogued. A common real-world failure is a Cloudflare or WAF rule that blocks AI crawlers by default, which silently removes a brand from ChatGPT and Perplexity answers.</p><p class="gl-why"><strong>Why 10:</strong> nothing else matters if bots cannot reach the page. This applies doubly to LLMs, since many AI crawlers do not render JavaScript and give up faster than Googlebot.</p><a class="gl-perma" href="#crawlability" aria-label="Link to Crawlability">#</a></article><article class="gl-term b5" id="indexability" data-term="" data-s="10"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Indexability</h3><span class="gl-sc" aria-label="Impact score 10 out of 10"><b>10</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><p class="gl-def">Indexability is whether a crawled page is allowed into, and accepted by, the search index. Pages can be crawlable but not indexable because of a noindex meta tag, an X-Robots-Tag header, a canonical pointing elsewhere, thin or duplicate content, or a quality judgment by Google (&quot;Crawled, currently not indexed&quot; in Search Console).</p><p class="gl-ex"><strong>Example:</strong> a staging-site noindex tag accidentally pushed to production can deindex an entire site within days. That single line of code is one of the most common causes of catastrophic traffic loss.</p><p class="gl-why"><strong>Why 10:</strong> a page that is not indexed cannot rank in Google, and AI Overviews and Gemini draw from Google&#x27;s index. Bing&#x27;s index similarly feeds ChatGPT search and Copilot.</p><a class="gl-perma" href="#indexability" aria-label="Link to Indexability">#</a></article><article class="gl-term b3" id="xml-sitemaps" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">XML sitemaps</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">An XML sitemap is a file (usually /sitemap.xml) listing the URLs you want indexed, often with last-modified dates. It is a discovery aid, not a ranking factor. Think of it as a table of contents handed to the crawler, useful when the internal link structure alone might miss pages.</p><p class="gl-ex"><strong>Example:</strong> a news site with 50,000 articles uses sitemaps segmented by type and date so new articles are found within minutes. Sitemaps also give clean per-section index coverage reports in Search Console.</p><p class="gl-why"><strong>Why 5:</strong> essential for large, new, or poorly linked sites, but a small site with solid internal linking gains little. Accurate lastmod dates do help fresh content get recrawled, which matters for AI search freshness.</p><a class="gl-perma" href="#xml-sitemaps" aria-label="Link to XML sitemaps">#</a></article><article class="gl-term b4" id="robots-txt" data-term="" data-s="7"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Robots.txt</h3><span class="gl-sc" aria-label="Impact score 7 out of 10"><b>7</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><p class="gl-def">Robots.txt is a plain-text file at your domain root that tells crawlers which paths they may or may not request. It controls crawling, not indexing: a disallowed URL can still appear in results if other sites link to it. In the AI era it also governs which AI bots (GPTBot, OAI-SearchBot, ClaudeBot, PerplexityBot, Google-Extended) can access your content.</p><p class="gl-ex"><strong>Analogy:</strong> it is the &quot;Staff Only&quot; sign on doors. Polite visitors obey it, and it is the main lever for deciding whether AI systems can read and cite you. Blocking OAI-SearchBot, for example, removes you from ChatGPT search citations.</p><p class="gl-why"><strong>Why 7:</strong> misconfiguration is catastrophic and the AI-bot decisions are strategic. Once set correctly, though, it needs little ongoing effort.</p><a class="gl-perma" href="#robots-txt" aria-label="Link to Robots.txt">#</a></article><article class="gl-term b4" id="canonical-tags" data-term="" data-s="7"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Canonical tags</h3><span class="gl-sc" aria-label="Impact score 7 out of 10"><b>7</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><p class="gl-def">A canonical tag (&lt;link rel=&quot;canonical&quot; href=&quot;...&quot;&gt;) tells search engines which URL is the master version when several URLs show the same or very similar content. Common sources of duplicates: tracking parameters, sort orders, print versions, HTTP vs HTTPS, and trailing slashes.</p><p class="gl-ex"><strong>Example:</strong> /shoes?color=red&amp;sort=price and /shoes?sort=price&amp;color=red are the same page. A canonical pointing both to /shoes?color=red consolidates link signals onto one URL instead of splitting them. Note that canonicals are hints; Google may override them if other signals disagree.</p><p class="gl-why"><strong>Why 7:</strong> central for e-commerce and large CMS sites, where parameter duplication can dilute rankings badly. Lower stakes for a 30-page brochure site.</p><a class="gl-perma" href="#canonical-tags" aria-label="Link to Canonical tags">#</a></article><article class="gl-term b4" id="site-architecture-url-structure" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Site architecture / URL structure</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">Site architecture is how pages are organized and linked: the hierarchy of categories, subcategories, and detail pages, and how many clicks each page sits from the homepage. URL structure is the visible reflection of that hierarchy (/services/roofing/metal-roof-repair/).</p><p class="gl-ex"><strong>Analogy:</strong> a well-organized department store puts related items in clearly labeled sections a short walk from the entrance. A flat, logical structure (important pages within three clicks) concentrates authority on key pages and tells search engines and LLMs what your site is about.</p><p class="gl-why"><strong>Why 8:</strong> architecture shapes how authority flows, how topics are understood, and how efficiently bots crawl. It is hard to fix later, so getting it right early compounds.</p><a class="gl-perma" href="#site-architecture-url-structure" aria-label="Link to Site architecture / URL structure">#</a></article><article class="gl-term b3" id="https-ssl" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">HTTPS / SSL</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">HTTPS encrypts traffic between browser and server using an SSL/TLS certificate. Google confirmed it as a lightweight ranking signal in 2014, and browsers label HTTP sites &quot;Not secure.&quot;</p><p class="gl-ex"><strong>Example:</strong> an HTTP checkout page triggers browser warnings that kill conversions and trust. Mixed content (HTTPS pages loading HTTP images or scripts) can also break features.</p><p class="gl-why"><strong>Why 6:</strong> today it is table stakes. Nearly every competitor already has it, so it gives no edge, but lacking it is a visible trust and ranking penalty.</p><a class="gl-perma" href="#https-ssl" aria-label="Link to HTTPS / SSL">#</a></article><article class="gl-term b3" id="core-web-vitals-lcp-inp-cls" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Core Web Vitals (LCP, INP, CLS)</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Core Web Vitals are Google&#x27;s user-experience metrics measured from real Chrome users. LCP (Largest Contentful Paint) is how fast the main content appears; good is under 2.5 seconds. INP (Interaction to Next Paint, which replaced FID in March 2024) is how fast the page responds to clicks and taps; good is under 200 ms. CLS (Cumulative Layout Shift) is how much the layout jumps while loading; good is under 0.1.</p><p class="gl-ex"><strong>Analogy:</strong> a restaurant where food arrives fast (LCP), the waiter responds when you wave (INP), and the table does not move while you eat (CLS). Example: an ad slot that loads late and pushes the article down causes high CLS and accidental clicks.</p><p class="gl-why"><strong>Why 5:</strong> Google calls page experience a tie-breaker. Relevance and authority beat speed, but in competitive SERPs where content is comparable, good vitals help, and they lift conversions regardless.</p><a class="gl-perma" href="#core-web-vitals-lcp-inp-cls" aria-label="Link to Core Web Vitals (LCP, INP, CLS)">#</a></article><article class="gl-term b3" id="page-speed-optimization" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Page speed optimization</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Page speed optimization is the broader engineering work behind fast pages: reducing server response time (TTFB), minifying and deferring JavaScript and CSS, caching, compressing assets, and cutting third-party scripts. Core Web Vitals measure the outcome; page speed work is how you get there.</p><p class="gl-ex"><strong>Example:</strong> removing three unused marketing tags and deferring a chat widget can cut load time by a second or more. Speed also affects crawl efficiency; a faster server lets Googlebot fetch more pages per visit, and AI fetchers that retrieve pages in real time may time out on slow ones.</p><p class="gl-why"><strong>Why 6:</strong> slightly above CWV because it also affects crawl rate, AI retrieval reliability, bounce rate, and conversions.</p><a class="gl-perma" href="#page-speed-optimization" aria-label="Link to Page speed optimization">#</a></article><article class="gl-term b4" id="mobile-friendliness-responsive-design" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Mobile-friendliness / responsive design</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">Responsive design means one site adapts its layout to any screen size. Google uses mobile-first indexing, meaning it crawls and ranks based on the mobile version of your pages. If content, links, or structured data are missing on mobile, Google effectively does not see them.</p><p class="gl-ex"><strong>Example:</strong> a site that hides its FAQ section and half its internal links behind a desktop-only menu loses those signals entirely under mobile-first indexing.</p><p class="gl-why"><strong>Why 8:</strong> most searches happen on mobile and Google ranks the mobile view. Nearly all modern themes are responsive, so the main risk is content parity, not layout.</p><a class="gl-perma" href="#mobile-friendliness-responsive-design" aria-label="Link to Mobile-friendliness / responsive design">#</a></article><article class="gl-term b4" id="structured-data-schema-markup-json-ld" data-term="" data-s="7"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Structured data / schema markup (JSON-LD)</h3><span class="gl-sc" aria-label="Impact score 7 out of 10"><b>7</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><p class="gl-def">Structured data is code (usually JSON-LD in the page head) that labels your content with a shared vocabulary from Schema.org: this is a Product with a price of $49, this is an Organization with these social profiles, this Person wrote this Article. It powers rich results (review stars, product prices, breadcrumbs, events) and helps machines understand entities and relationships.</p><p class="gl-ex"><strong>Analogy:</strong> your page is a letter; schema is the clearly printed address label. The postal worker could read the letter to figure out where it goes, but the label removes the guesswork.</p><p class="gl-why"><strong>Why 7:</strong> it is not a direct ranking factor, but it unlocks rich results that lift click-through rate and clarifies entities for Google&#x27;s Knowledge Graph. The LLM benefit is real but indirect. Note that Google retired FAQ rich results on May 7, 2026, after retiring HowTo in 2023, so markup choices should follow what Google still displays.</p><a class="gl-perma" href="#structured-data-schema-markup-json-ld" aria-label="Link to Structured data / schema markup (JSON-LD)">#</a></article><article class="gl-term b2" id="hreflang-international-targeting" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Hreflang / international targeting</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Hreflang attributes tell Google which language and regional version of a page to show to which users (for example en-us, en-gb, es-mx). They prevent the UK version of a page from ranking in the US and stop near-identical English versions from being treated as duplicates.</p><p class="gl-ex"><strong>Example:</strong> a SaaS company with /us/pricing in dollars and /uk/pricing in pounds uses hreflang so British searchers see pound prices. Implementations must be reciprocal (each page references all others), which is where most errors happen.</p><p class="gl-why"><strong>Why 4:</strong> it scores 0 for single-country sites and 9 for multinational ones. The average is low because most sites do not need it.</p><a class="gl-perma" href="#hreflang-international-targeting" aria-label="Link to Hreflang / international targeting">#</a></article><article class="gl-term b2" id="pagination-handling" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Pagination handling</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Pagination handling is how you structure content split across multiple pages (/blog/page/2, /category?page=3). Google dropped support for rel=next/prev in 2019, so best practice now is plain crawlable links to each page, self-referencing canonicals on each page, and not noindexing deep pages that hold unique products or articles.</p><p class="gl-ex"><strong>Example:</strong> a category page with 400 products across 20 pages; if pages 2 to 20 are canonicalized to page 1, the products listed only there may never get discovered.</p><p class="gl-why"><strong>Why 3:</strong> matters mainly for large e-commerce, forums, and blogs. A secondary concern for most sites.</p><a class="gl-perma" href="#pagination-handling" aria-label="Link to Pagination handling">#</a></article><article class="gl-term b4" id="javascript-rendering-ssr-vs-csr" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">JavaScript rendering / SSR vs CSR</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">Client-side rendering (CSR) builds the page in the visitor&#x27;s browser with JavaScript; the raw HTML is nearly empty. Server-side rendering (SSR) or static generation sends fully formed HTML. Googlebot can render JavaScript, but in a deferred second wave, and most AI crawlers (GPTBot, ClaudeBot, PerplexityBot) do not execute JavaScript at all.</p><p class="gl-ex"><strong>Analogy:</strong> CSR sends a flat-pack box and assembly instructions; SSR sends the finished chair. Google will assemble it eventually. Most AI bots look at the box, see no chair, and leave.</p><p class="gl-ex"><strong>Example:</strong> a React single-page app with product descriptions loaded via API calls may be invisible to ChatGPT and Perplexity even while ranking fine in Google.</p><p class="gl-why"><strong>Why 8:</strong> for JavaScript-heavy sites, this is the difference between existing and not existing in AI search. It is the most under-appreciated technical issue for LLM visibility.</p><a class="gl-perma" href="#javascript-rendering-ssr-vs-csr" aria-label="Link to JavaScript rendering / SSR vs CSR">#</a></article><article class="gl-term b3" id="duplicate-content-management" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Duplicate content management</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Duplicate content is substantially identical text appearing at more than one URL, on your site or across sites. Google does not penalize ordinary duplication, but it picks one version to show and splits link signals among the copies. Management tools include canonicals, 301 redirects, parameter handling, noindex, and writing unique content.</p><p class="gl-ex"><strong>Example:</strong> a franchise with 40 location pages that differ only in the city name creates near-duplicates; Google may index a few and ignore the rest.</p><p class="gl-why"><strong>Why 6:</strong> rarely dramatic on small sites, but scaled duplication (location pages, product variants, syndicated articles) wastes crawl budget and dilutes rankings.</p><a class="gl-perma" href="#duplicate-content-management" aria-label="Link to Duplicate content management">#</a></article><article class="gl-term b3" id="redirect-management-301-302-chains" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Redirect management (301, 302, chains)</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Redirects send users and bots from one URL to another. A 301 is permanent and passes ranking signals to the destination; a 302 is temporary and tells Google to keep the original indexed. Chains (A to B to C) and loops slow crawling and can leak signal.</p><p class="gl-ex"><strong>Analogy:</strong> a forwarding address after you move. One forward works fine; a chain of five forwarding addresses means some mail gets lost.</p><p class="gl-ex"><strong>Example:</strong> during a site migration, failing to 301 old URLs to their new equivalents is the most common cause of a 30 to 70 percent traffic drop.</p><p class="gl-why"><strong>Why 6:</strong> low day-to-day, but critical during migrations, redesigns, and URL changes, when mistakes can erase years of accumulated authority.</p><a class="gl-perma" href="#redirect-management-301-302-chains" aria-label="Link to Redirect management (301, 302, chains)">#</a></article><article class="gl-term b3" id="http-status-codes-error-handling-404-5xx" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">HTTP status codes / error handling (404, 5xx)</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Status codes are the server&#x27;s response type. 200 means OK, 301/302 mean redirect, 404 means not found, 410 means gone permanently, 5xx means server error. &quot;Soft 404s&quot; are empty or error pages that wrongly return 200.</p><p class="gl-ex"><strong>Example:</strong> 404s on deleted pages are normal and harmless. Recurring 5xx errors are not; if Googlebot repeatedly hits server errors it slows crawling and can drop pages from the index.</p><p class="gl-why"><strong>Why 6:</strong> occasional 404s do not hurt rankings. Persistent 5xx errors, broken internal links, and 404s on pages with valuable backlinks do.</p><a class="gl-perma" href="#http-status-codes-error-handling-404-5xx" aria-label="Link to HTTP status codes / error handling (404, 5xx)">#</a></article><article class="gl-term b2" id="log-file-analysis" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Log file analysis</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Log file analysis means reading your server&#x27;s raw access logs to see exactly which bots requested which URLs, how often, and what status codes they got. It is the only ground truth for crawler behavior, and it now shows which AI crawlers visit and which pages they fetch.</p><p class="gl-ex"><strong>Example:</strong> logs reveal Googlebot spends 60 percent of its visits on filter URLs with no search value, while new product pages are crawled once a month.</p><p class="gl-why"><strong>Why 3:</strong> a diagnostic, not a lever. Invaluable on large sites, overkill for small ones.</p><a class="gl-perma" href="#log-file-analysis" aria-label="Link to Log file analysis">#</a></article><article class="gl-term b2" id="crawl-budget-optimization" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Crawl budget optimization</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Crawl budget is the number of URLs a search engine will crawl on your site in a given period, shaped by server capacity and how much Google wants your content. Optimization means cutting waste (duplicate, parameter, and low-value URLs) so crawlers spend time on pages that matter.</p><p class="gl-ex"><strong>Analogy:</strong> an inspector with eight hours a day. If half the day goes to identical storage closets, the new wing never gets inspected.</p><p class="gl-why"><strong>Why 3:</strong> Google says crawl budget matters mainly for sites with more than roughly a million pages, or tens of thousands that change daily. Most sites never hit the limit.</p><a class="gl-perma" href="#crawl-budget-optimization" aria-label="Link to Crawl budget optimization">#</a></article><article class="gl-term b2" id="faceted-navigation-control" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Faceted navigation control</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Faceted navigation is the filter system on category pages (size, color, brand, price). Each combination can create a unique URL, producing millions of near-duplicate pages. Control means deciding which filter pages deserve indexing (&quot;red running shoes&quot; has search demand) and blocking or canonicalizing the rest.</p><p class="gl-ex"><strong>Example:</strong> a site with 10 filters of 10 values each can theoretically generate billions of URL combinations, swamping crawlers.</p><p class="gl-why"><strong>Why 4:</strong> a site-killer for large e-commerce if ignored, irrelevant elsewhere. The e-commerce section scores its opportunity side separately.</p><a class="gl-perma" href="#faceted-navigation-control" aria-label="Link to Faceted navigation control">#</a></article><article class="gl-term b3" id="cdn-hosting-performance" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">CDN / hosting performance</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">A CDN (content delivery network) stores copies of your site on servers around the world so users load from a nearby location. Hosting quality determines server response time, uptime, and capacity to handle crawler and user traffic.</p><p class="gl-ex"><strong>Example:</strong> a site on overloaded shared hosting with 1.5-second server response will struggle with Core Web Vitals no matter how optimized the front end is. CDN bot-protection settings can also accidentally block AI crawlers, which ties back to crawlability.</p><p class="gl-why"><strong>Why 5:</strong> uptime and speed are foundations, and cheap hosting creates a ceiling. Beyond &quot;fast and reliable,&quot; further investment shows diminishing returns.</p><a class="gl-perma" href="#cdn-hosting-performance" aria-label="Link to CDN / hosting performance">#</a></article><article class="gl-term b2" id="image-optimization-compression-webp-lazy-loading" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Image optimization (compression, WebP, lazy loading)</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Image optimization means serving images at the right dimensions, compressed in modern formats (WebP, AVIF), with lazy loading for images below the fold and eager loading for the main hero image. Images are usually the heaviest part of a page.</p><p class="gl-ex"><strong>Example:</strong> a 4 MB hero photo converted to a 180 KB WebP can cut LCP by over a second. A common mistake is lazy-loading the hero image, which delays LCP.</p><p class="gl-why"><strong>Why 4:</strong> mostly a page-speed contributor. It also enables Google Images traffic, which matters a lot for e-commerce, recipes, and design niches.</p><a class="gl-perma" href="#image-optimization-compression-webp-lazy-loading" aria-label="Link to Image optimization (compression, WebP, lazy loading)">#</a></article><article class="gl-term b2" id="orphan-page-detection" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Orphan page detection</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">An orphan page has no internal links pointing to it. Bots can only find it via sitemaps or external links, and it receives no internal authority. Detection means comparing your crawl against sitemaps, analytics, and logs to find pages that exist but are unlinked.</p><p class="gl-ex"><strong>Analogy:</strong> a room in your house with no door from any hallway. It exists, but nobody wanders into it, and visitors assume it is unimportant.</p><p class="gl-ex"><strong>Example:</strong> landing pages built for paid campaigns, or old blog posts dropped from pagination, often become orphans.</p><p class="gl-why"><strong>Why 4:</strong> fixing orphans is quick, cheap, and reliably helps the affected pages. But it rarely moves sitewide performance unless many important pages are orphaned.</p><a class="gl-perma" href="#orphan-page-detection" aria-label="Link to Orphan page detection">#</a></article></div></div></section><section class="gl-sec gl-alt" id="on-page-seo" data-spy="" aria-labelledby="on-page-seo-h"><div class="wrap gl-sgrid"><aside class="gl-aside"><div class="gl-stick"><div class="gl-snum"><b>02</b><span>16 terms</span></div><h2 class="gl-sh" id="on-page-seo-h">On-Page SEO</h2><p class="gl-sintro">On-page SEO is everything you control on the page itself to signal relevance and usefulness. The heavy hitters are content quality, depth, internal linking, and title tags; the old mechanical levers (keyword density, meta descriptions) have faded.</p><div class="gl-rbox"><span class="e-eb">Ranked by impact</span><ol class="gl-rank"><li class="b5" data-for="content-optimization"><a href="#content-optimization"><span class="gl-rn">Content optimization</span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b4" data-for="title-tags"><a href="#title-tags"><span class="gl-rn">Title tags</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4" data-for="internal-linking"><a href="#internal-linking"><span class="gl-rn">Internal linking</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4" data-for="content-depth-comprehensiveness"><a href="#content-depth-comprehensiveness"><span class="gl-rn">Content depth / comprehensiveness</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4" data-for="content-freshness-updating"><a href="#content-freshness-updating"><span class="gl-rn">Content freshness / updating</span><span class="gl-rb" aria-hidden="true"><i style="width: 70%"></i></span><b>7</b></a></li><li class="b3" data-for="header-hierarchy-h1-to-h6"><a href="#header-hierarchy-h1-to-h6"><span class="gl-rn">Header hierarchy (H1 to H6)</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b3" data-for="anchor-text-optimization"><a href="#anchor-text-optimization"><span class="gl-rn">Anchor text optimization</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b3" data-for="featured-snippet-optimization"><a href="#featured-snippet-optimization"><span class="gl-rn">Featured snippet optimization</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b3" data-for="readability"><a href="#readability"><span class="gl-rn">Readability</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b2" data-for="semantic-html"><a href="#semantic-html"><span class="gl-rn">Semantic HTML</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li><li class="b2" data-for="meta-descriptions"><a href="#meta-descriptions"><span class="gl-rn">Meta descriptions</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li><li class="b2" data-for="keyword-placement-density"><a href="#keyword-placement-density"><span class="gl-rn">Keyword placement / density</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li><li class="b2" data-for="image-alt-text"><a href="#image-alt-text"><span class="gl-rn">Image alt text</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li><li class="b2" data-for="url-slugs"><a href="#url-slugs"><span class="gl-rn">URL slugs</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li><li class="b2" data-for="table-of-contents-jump-links"><a href="#table-of-contents-jump-links"><span class="gl-rn">Table of contents / jump links</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li><li class="b2" data-for="outbound-linking-strategy"><a href="#outbound-linking-strategy"><span class="gl-rn">Outbound linking strategy</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li></ol><button type="button" class="gl-more" aria-expanded="false">Show all 16</button></div></div></aside><div class="gl-terms"><article class="gl-term b4" id="title-tags" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Title tags</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">The title tag (&lt;title&gt;) is the page&#x27;s official name, shown as the blue clickable headline in search results and in browser tabs. It is still one of the strongest on-page relevance signals and the biggest driver of click-through rate from the SERP.</p><p class="gl-ex"><strong>Example:</strong> &quot;Metal Roof Repair in Lexington, KY | Same-Week Service | Acme Roofing&quot; beats &quot;Services | Acme.&quot; Google rewrites roughly 60 percent of titles it considers unhelpful, so the title must accurately describe the page, ideally under about 60 characters.</p><p class="gl-why"><strong>Why 8:</strong> a strong relevance signal and the main CTR lever, at almost no cost. Small title changes often produce measurable ranking and click gains within weeks.</p><a class="gl-perma" href="#title-tags" aria-label="Link to Title tags">#</a></article><article class="gl-term b2" id="meta-descriptions" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Meta descriptions</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">The meta description is a short summary (around 150 to 160 characters) that may appear under the title in search results. It is not a ranking factor, and Google rewrites it most of the time, preferring a snippet from the page that matches the query.</p><p class="gl-ex"><strong>Analogy:</strong> the blurb on the back of a book. It does not change where the book is shelved, but it can persuade someone to pick it up.</p><p class="gl-why"><strong>Why 3:</strong> zero direct ranking value and frequently ignored. A good one modestly improves CTR on pages where Google uses it.</p><a class="gl-perma" href="#meta-descriptions" aria-label="Link to Meta descriptions">#</a></article><article class="gl-term b3" id="header-hierarchy-h1-to-h6" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Header hierarchy (H1 to H6)</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Headers structure a page into an outline: one H1 for the main topic, H2s for major sections, H3s for subsections. They help users scan, help Google understand topical subsections, and help LLMs and AI Overviews extract self-contained passages.</p><p class="gl-ex"><strong>Example:</strong> a guide titled &quot;How to Choose a Metal Roof&quot; with H2s for cost, durability, styles, and installation lets Google rank a specific section (passage ranking) for &quot;how long do metal roofs last.&quot;</p><p class="gl-why"><strong>Why 5:</strong> a meaningful structure and extraction aid, especially for AI, but Google states that skipping levels or using multiple H1s does not hurt rankings.</p><a class="gl-perma" href="#header-hierarchy-h1-to-h6" aria-label="Link to Header hierarchy (H1 to H6)">#</a></article><article class="gl-term b2" id="keyword-placement-density" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Keyword placement / density</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Keyword placement means putting the target term in high-signal spots: title, H1, the first paragraph, a subheading, the URL. Keyword density is the percentage of words that are the keyword. Placement still matters a little; density is an obsolete concept from the early 2000s.</p><p class="gl-ex"><strong>Example:</strong> a page about &quot;commercial roof coatings&quot; should say that phrase plainly near the top. Repeating it 40 times (&quot;keyword stuffing&quot;) is a spam signal that can hurt rankings.</p><p class="gl-why"><strong>Why 3:</strong> basic placement is worth a few minutes per page. Modern semantic search understands synonyms and topics, so density targets are wasted effort.</p><a class="gl-perma" href="#keyword-placement-density" aria-label="Link to Keyword placement / density">#</a></article><article class="gl-term b5" id="content-optimization" data-term="" data-s="9"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Content optimization</h3><span class="gl-sc" aria-label="Impact score 9 out of 10"><b>9</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span><p class="gl-def">Content optimization is the process of making a page the best possible answer for its target query: matching search intent, covering the subtopics searchers expect, answering likely follow-up questions, adding unique expertise, and presenting it clearly.</p><p class="gl-ex"><strong>Analogy:</strong> two contractors bid on the same job. One sends a one-line quote; the other sends a clear scope, timeline, photos of past work, and answers your questions before you ask. Both are &quot;relevant&quot;; only one wins.</p><p class="gl-ex"><strong>Example:</strong> a page targeting &quot;best CRM for small business&quot; that compares options in a table, states pricing, includes hands-on testing notes, and recommends picks by use case will outrank a generic 500-word overview.</p><p class="gl-why"><strong>Why 9:</strong> content is what Google ranks and what LLMs quote. Helpfulness and intent match are the core of every modern ranking system.</p><a class="gl-perma" href="#content-optimization" aria-label="Link to Content optimization">#</a></article><article class="gl-term b4" id="internal-linking" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Internal linking</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">Internal links are links from one page on your site to another. They help crawlers discover pages, distribute authority (PageRank) from strong pages to weaker ones, and use anchor text to tell Google what the destination is about.</p><p class="gl-ex"><strong>Analogy:</strong> internal links are the hallway signs and the recommendations of a trusted employee. &quot;If you liked this, see our guide to X&quot; passes both the visitor and credibility along.</p><p class="gl-ex"><strong>Example:</strong> linking from a high-traffic blog post about roof leaks to the &quot;emergency roof repair&quot; service page can lift that service page several positions with no new backlinks.</p><p class="gl-why"><strong>Why 8:</strong> one of the highest-ROI, fully controllable levers in SEO. Most sites underuse it.</p><a class="gl-perma" href="#internal-linking" aria-label="Link to Internal linking">#</a></article><article class="gl-term b3" id="anchor-text-optimization" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Anchor text optimization</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Anchor text is the clickable text of a link. For internal links, descriptive anchors (&quot;metal roof repair pricing&quot;) are a relevance signal. For backlinks, anchor text is more sensitive: too many exact-match keyword anchors from other sites looks manipulative.</p><p class="gl-ex"><strong>Example:</strong> &quot;click here&quot; tells Google nothing; &quot;compare our roof warranty options&quot; tells it what the destination covers.</p><p class="gl-why"><strong>Why 5:</strong> reliably useful and free for internal links. The off-page version is covered under anchor text distribution.</p><a class="gl-perma" href="#anchor-text-optimization" aria-label="Link to Anchor text optimization">#</a></article><article class="gl-term b2" id="image-alt-text" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Image alt text</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Alt text is a short written description of an image in the HTML (alt=&quot;...&quot;). It exists for screen readers and accessibility, and it helps Google Images understand the picture.</p><p class="gl-ex"><strong>Example:</strong> alt=&quot;standing seam metal roof on a two-story brick house&quot; describes the image; alt=&quot;roof roofing roofer best roof&quot; is stuffing.</p><p class="gl-why"><strong>Why 3:</strong> small effect on web rankings, real effect on image search and accessibility compliance. Do it for users first.</p><a class="gl-perma" href="#image-alt-text" aria-label="Link to Image alt text">#</a></article><article class="gl-term b2" id="url-slugs" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">URL slugs</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">The slug is the readable end of a URL: /metal-roof-repair/ rather than /page?id=4827. Good slugs are short, lowercase, hyphenated, and descriptive.</p><p class="gl-ex"><strong>Example:</strong> a user deciding between two results trusts acme.com/metal-roof-repair more than acme.com/p/4827-x. Google has said words in URLs are a very lightweight signal.</p><p class="gl-why"><strong>Why 3:</strong> set them well on new pages, but never change existing slugs just for SEO; the redirect risk outweighs the tiny gain.</p><a class="gl-perma" href="#url-slugs" aria-label="Link to URL slugs">#</a></article><article class="gl-term b4" id="content-freshness-updating" data-term="" data-s="7"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Content freshness / updating</h3><span class="gl-sc" aria-label="Impact score 7 out of 10"><b>7</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><p class="gl-def">Freshness is how recently content was meaningfully updated. Google&#x27;s &quot;query deserves freshness&quot; systems favor recent content for time-sensitive topics (prices, laws, product reviews, &quot;best X in 2026&quot;), and LLM search tools strongly prefer recent sources when retrieving live results.</p><p class="gl-ex"><strong>Example:</strong> &quot;Best Project Management Software&quot; updated in September 2026 with current pricing outranks the same article last touched in 2023. Changing the date without changing content is detectable and does not work.</p><p class="gl-why"><strong>Why 7:</strong> high for time-sensitive topics and AI retrieval, low for evergreen topics like &quot;how photosynthesis works.&quot; Regular refreshes are one of the cheapest ways to recover declining pages.</p><a class="gl-perma" href="#content-freshness-updating" aria-label="Link to Content freshness / updating">#</a></article><article class="gl-term b2" id="semantic-html" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Semantic HTML</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Semantic HTML uses elements that describe meaning rather than appearance: &lt;article&gt;, &lt;nav&gt;, &lt;main&gt;, &lt;table&gt;, &lt;ol&gt;, &lt;header&gt;, &lt;footer&gt;. It helps machines separate main content from navigation and boilerplate.</p><p class="gl-ex"><strong>Analogy:</strong> labeling the boxes when you move (&quot;kitchen,&quot; &quot;books&quot;) versus writing nothing. The movers can still unpack, but labels speed everything up.</p><p class="gl-ex"><strong>Example:</strong> a comparison presented as a real HTML &lt;table&gt; is far easier for Google and LLMs to extract than the same data built from styled &lt;div&gt; blocks or embedded in an image.</p><p class="gl-why"><strong>Why 4:</strong> modest direct impact, but it improves extraction for AI and featured snippets, and it improves accessibility.</p><a class="gl-perma" href="#semantic-html" aria-label="Link to Semantic HTML">#</a></article><article class="gl-term b3" id="featured-snippet-optimization" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Featured snippet optimization</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Featured snippet optimization is formatting content so Google can lift it into the answer box above the organic results: a 40 to 60 word direct definition under a question heading, a numbered list for steps, or a table for comparisons.</p><p class="gl-ex"><strong>Example:</strong> under the H2 &quot;How long does a metal roof last?&quot;, the first sentence reads &quot;A metal roof typically lasts 40 to 70 years, depending on material, climate, and installation.&quot; That is snippet-ready.</p><p class="gl-why"><strong>Why 5:</strong> AI Overviews now sit above or replace many snippets, which reduces their traffic value. The same formatting, however, is exactly what AI Overviews and LLMs extract, so the skill transfers.</p><a class="gl-perma" href="#featured-snippet-optimization" aria-label="Link to Featured snippet optimization">#</a></article><article class="gl-term b2" id="table-of-contents-jump-links" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Table of contents / jump links</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">A table of contents is a linked list of sections at the top of a long page. It helps users navigate and can earn &quot;jump to&quot; links in Google results that send searchers straight to a section.</p><p class="gl-ex"><strong>Example:</strong> a 4,000-word buyer&#x27;s guide with a TOC lets a reader jump to &quot;Pricing&quot; immediately, and Google may display those section links under the result.</p><p class="gl-why"><strong>Why 3:</strong> a usability improvement with small SEO side benefits. Useful on long content only.</p><a class="gl-perma" href="#table-of-contents-jump-links" aria-label="Link to Table of contents / jump links">#</a></article><article class="gl-term b2" id="outbound-linking-strategy" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Outbound linking strategy</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Outbound links point from your site to other sites. Linking to authoritative, relevant sources (studies, official documentation, original data) supports claims and signals that your content is well-researched. Paid or sponsored outbound links must use rel=&quot;sponsored&quot; or nofollow.</p><p class="gl-ex"><strong>Example:</strong> a health article citing the CDC and a peer-reviewed study reads as more trustworthy to users and quality raters than one making unsupported claims.</p><p class="gl-why"><strong>Why 3:</strong> Google says outbound links are not a direct ranking boost. They matter as part of credibility and E-E-A-T, especially in health, finance, and legal topics.</p><a class="gl-perma" href="#outbound-linking-strategy" aria-label="Link to Outbound linking strategy">#</a></article><article class="gl-term b4" id="content-depth-comprehensiveness" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Content depth / comprehensiveness</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">Depth means covering a topic thoroughly enough that the searcher does not need to go elsewhere: the main question, the related subtopics, edge cases, and practical next steps. It is not the same as word count; a 600-word page can be complete and a 5,000-word page can be padded.</p><p class="gl-ex"><strong>Analogy:</strong> a good doctor&#x27;s visit answers your question, then answers the three follow-ups you had not thought of yet.</p><p class="gl-ex"><strong>Example:</strong> a page on &quot;roof replacement cost&quot; that covers cost by material, by roof size, regional variation, hidden costs, financing, and insurance outranks one giving a single national average.</p><p class="gl-why"><strong>Why 8:</strong> comprehensive pages rank for hundreds of long-tail variations and give LLMs more extractable answers. The penalty for padding is real, so depth must be useful depth.</p><a class="gl-perma" href="#content-depth-comprehensiveness" aria-label="Link to Content depth / comprehensiveness">#</a></article><article class="gl-term b3" id="readability" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Readability</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Readability is how easily people can read and understand the content: short paragraphs, plain language, clear structure, scannable formatting, defined jargon. Readability scores are not ranking factors, but readability drives engagement, which Google observes through its user-interaction systems.</p><p class="gl-ex"><strong>Example:</strong> a wall-of-text legal page loses readers in seconds; the same information as short sections with plain-language summaries keeps them.</p><p class="gl-why"><strong>Why 5:</strong> an indirect but real factor. Clear, well-structured writing is also easier for LLMs to quote accurately.</p><a class="gl-perma" href="#readability" aria-label="Link to Readability">#</a></article></div></div></section><section class="gl-sec" id="off-page-seo" data-spy="" aria-labelledby="off-page-seo-h"><div class="wrap gl-sgrid"><aside class="gl-aside"><div class="gl-stick"><div class="gl-snum"><b>03</b><span>20 terms</span></div><h2 class="gl-sh" id="off-page-seo-h">Off-Page SEO</h2><p class="gl-sintro">Off-page SEO is how the rest of the web vouches for you. Earned links and brand mentions from real, relevant publications remain among the strongest signals for Google and the strongest single driver of LLM recommendations; manipulative link schemes score low because penalty risk wipes out their expected value.</p><div class="gl-rbox"><span class="e-eb">Ranked by impact</span><ol class="gl-rank"><li class="b5" data-for="link-building"><a href="#link-building"><span class="gl-rn">Link building</span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b5" data-for="digital-pr"><a href="#digital-pr"><span class="gl-rn">Digital PR</span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b5" data-for="brand-mentions-citations"><a href="#brand-mentions-citations"><span class="gl-rn">Brand mentions / citations</span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b3" data-for="haro-journalist-outreach"><a href="#haro-journalist-outreach"><span class="gl-rn">HARO / journalist outreach</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="unlinked-brand-mention-reclamation"><a href="#unlinked-brand-mention-reclamation"><span class="gl-rn">Unlinked brand mention reclamation</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b3" data-for="backlink-profile-analysis"><a href="#backlink-profile-analysis"><span class="gl-rn">Backlink profile analysis</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b3" data-for="podcast-interview-placements"><a href="#podcast-interview-placements"><span class="gl-rn">Podcast / interview placements</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b2" data-for="guest-posting"><a href="#guest-posting"><span class="gl-rn">Guest posting</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li><li class="b2" data-for="broken-link-building"><a href="#broken-link-building"><span class="gl-rn">Broken link building</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li><li class="b2" data-for="anchor-text-distribution"><a href="#anchor-text-distribution"><span class="gl-rn">Anchor text distribution</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li><li class="b2" data-for="influencer-collaboration"><a href="#influencer-collaboration"><span class="gl-rn">Influencer collaboration</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li><li class="b2" data-for="skyscraper-technique"><a href="#skyscraper-technique"><span class="gl-rn">Skyscraper technique</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li><li class="b2" data-for="social-syndication"><a href="#social-syndication"><span class="gl-rn">Social syndication</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li><li class="b2" data-for="resource-page-links"><a href="#resource-page-links"><span class="gl-rn">Resource page links</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li><li class="b1" data-for="link-buying-selling"><a href="#link-buying-selling"><span class="gl-rn">Link buying / selling</span><span class="gl-rb" aria-hidden="true"><i style="width: 20%"></i></span><b>2</b></a></li><li class="b1" data-for="spam-link-discovery"><a href="#spam-link-discovery"><span class="gl-rn">Spam link discovery</span><span class="gl-rb" aria-hidden="true"><i style="width: 20%"></i></span><b>2</b></a></li><li class="b1" data-for="link-velocity"><a href="#link-velocity"><span class="gl-rn">Link velocity</span><span class="gl-rb" aria-hidden="true"><i style="width: 20%"></i></span><b>2</b></a></li><li class="b1" data-for="sneaky-backlinks"><a href="#sneaky-backlinks"><span class="gl-rn">Sneaky backlinks</span><span class="gl-rb" aria-hidden="true"><i style="width: 10%"></i></span><b>1</b></a></li><li class="b1" data-for="tiered-link-building"><a href="#tiered-link-building"><span class="gl-rn">Tiered link building</span><span class="gl-rb" aria-hidden="true"><i style="width: 10%"></i></span><b>1</b></a></li><li class="b1" data-for="private-blog-networks-pbns"><a href="#private-blog-networks-pbns"><span class="gl-rn">Private blog networks (PBNs)</span><span class="gl-rb" aria-hidden="true"><i style="width: 10%"></i></span><b>1</b></a></li></ol><button type="button" class="gl-more" aria-expanded="false">Show all 20</button></div></div></aside><div class="gl-terms"><article class="gl-term b5" id="link-building" data-term="" data-s="9"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Link building</h3><span class="gl-sc" aria-label="Impact score 9 out of 10"><b>9</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span><p class="gl-def">Link building is the overall practice of earning or acquiring hyperlinks from other websites to yours. Google&#x27;s PageRank treats each link as a vote of confidence, weighted by the linking site&#x27;s own authority and relevance. It is the umbrella for most of the tactics below.</p><p class="gl-ex"><strong>Analogy:</strong> academic citations. A paper cited by 200 respected researchers is assumed to be important; one cited by nobody, or only by the author&#x27;s friends, is not.</p><p class="gl-ex"><strong>Example:</strong> a local HVAC company earning links from the city&#x27;s chamber of commerce, a local news story, and two trade associations will typically outrank a competitor with better on-page content but no links.</p><p class="gl-why"><strong>Why 9:</strong> still one of Google&#x27;s top ranking signals, especially in competitive niches. Quality and relevance matter far more than volume.</p><a class="gl-perma" href="#link-building" aria-label="Link to Link building">#</a></article><article class="gl-term b5" id="digital-pr" data-term="" data-s="9"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Digital PR</h3><span class="gl-sc" aria-label="Impact score 9 out of 10"><b>9</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span><p class="gl-def">Digital PR is creating newsworthy stories, data, or expert commentary and pitching it to journalists so publications cover you and link to you. It produces the highest-authority links (major news sites, trade publications) and simultaneously creates brand mentions in exactly the sources LLMs trust most.</p><p class="gl-ex"><strong>Example:</strong> a moving company analyzes 50,000 of its own moves and publishes &quot;The States Americans Are Leaving in 2026.&quot; The study is picked up by regional news outlets and real estate blogs, earning dozens of links and citations.</p><p class="gl-why"><strong>Why 9:</strong> the rare tactic that is top-tier for both Google and LLMs at once. Expensive and skill-intensive, but the most durable form of off-page work.</p><a class="gl-perma" href="#digital-pr" aria-label="Link to Digital PR">#</a></article><article class="gl-term b2" id="guest-posting" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Guest posting</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Guest posting is writing articles for other websites in exchange for exposure and, usually, a link back. Done on genuinely relevant, editorially strict publications, it builds expertise and real referral traffic. Done at scale on &quot;write for us&quot; sites that exist to sell posts, it is a link scheme that Google targets.</p><p class="gl-ex"><strong>Example:</strong> a cybersecurity founder writing a byline for a respected industry publication is valuable. Buying 40 posts on generic blogs with exact-match anchors is not.</p><p class="gl-why"><strong>Why 4:</strong> quality guest posts help, but the tactic has been heavily abused and Google discounts most of those links. Its best use today is authority and visibility, not link volume.</p><a class="gl-perma" href="#guest-posting" aria-label="Link to Guest posting">#</a></article><article class="gl-term b2" id="broken-link-building" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Broken link building</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Broken link building means finding dead links (404s) on other websites, creating or pointing to a good replacement resource on your site, and asking the site owner to update the link to you.</p><p class="gl-ex"><strong>Analogy:</strong> noticing a neighbor&#x27;s street sign points to a store that closed, and offering them the address of your open store that sells the same thing.</p><p class="gl-why"><strong>Why 4:</strong> a legitimate, white-hat tactic that earns relevant links. Response rates are low and it is slow to scale, so its share of real-world results is modest.</p><a class="gl-perma" href="#broken-link-building" aria-label="Link to Broken link building">#</a></article><article class="gl-term b1" id="sneaky-backlinks" data-term="" data-s="1"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Sneaky backlinks</h3><span class="gl-sc" aria-label="Impact score 1 out of 10"><b>1</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">&quot;Sneaky&quot; backlinks are links placed through deception rather than editorial choice: links hidden in widgets, WordPress themes, or plugin footers; hidden text links; links injected into hacked sites; mass comment and forum-profile spam; and links slipped into content without the owner&#x27;s knowledge.</p><p class="gl-ex"><strong>Example:</strong> a free website-counter widget that silently includes &quot;best payday loans&quot; links in its embed code. Google&#x27;s SpamBrain is trained specifically to detect these patterns.</p><p class="gl-why"><strong>Why 1:</strong> Google either ignores these links or issues manual actions for unnatural links. Expected value is negative for any business that plans to exist in two years, and some variants (hacked-site injection) are illegal.</p><a class="gl-perma" href="#sneaky-backlinks" aria-label="Link to Sneaky backlinks">#</a></article><article class="gl-term b3" id="haro-journalist-outreach" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">HARO / journalist outreach</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">HARO (Help A Reporter Out) was a service connecting journalists with expert sources; it was shut down and relaunched in different forms, and similar platforms (Qwoted, Featured, Source of Sources, Connectively and its successors) fill the role. The tactic is responding to journalist requests with expert quotes, earning mentions and links in articles.</p><p class="gl-ex"><strong>Example:</strong> a CPA answers a reporter&#x27;s request about 2026 tax deadline changes and gets quoted, with a link, in a personal-finance article on a national outlet.</p><p class="gl-why"><strong>Why 6:</strong> produces high-authority links and expert mentions LLMs pick up. These platforms are now flooded with AI-written pitches, so success requires speed and genuine expertise.</p><a class="gl-perma" href="#haro-journalist-outreach" aria-label="Link to HARO / journalist outreach">#</a></article><article class="gl-term b3" id="unlinked-brand-mention-reclamation" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Unlinked brand mention reclamation</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">This means finding articles that mention your brand, product, or people without linking to you, then politely asking the author to add a link. The author already likes you enough to mention you, so conversion rates are relatively high.</p><p class="gl-ex"><strong>Example:</strong> a trade magazine writes &quot;tools like Acme Scheduler have changed field service.&quot; A short email asking them to link the name often succeeds.</p><p class="gl-why"><strong>Why 5:</strong> cheap, white-hat, and good conversion. Limited by how often you are mentioned, and the unlinked mention already carries some value for LLMs on its own.</p><a class="gl-perma" href="#unlinked-brand-mention-reclamation" aria-label="Link to Unlinked brand mention reclamation">#</a></article><article class="gl-term b1" id="tiered-link-building" data-term="" data-s="1"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Tiered link building</h3><span class="gl-sc" aria-label="Impact score 1 out of 10"><b>1</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Tiered link building builds layers of links: tier 1 links point to your site, tier 2 links point to the tier 1 pages to strengthen them, tier 3 links point to tier 2, and so on, usually with lower-quality, automated links at lower tiers.</p><p class="gl-ex"><strong>Analogy:</strong> building a pyramid of fake references to vouch for your fake references.</p><p class="gl-why"><strong>Why 1:</strong> it is a link scheme by design. Lower tiers are almost always spam that Google ignores or penalizes, and if the upper tiers are good links you did not need the pyramid.</p><a class="gl-perma" href="#tiered-link-building" aria-label="Link to Tiered link building">#</a></article><article class="gl-term b1" id="link-buying-selling" data-term="" data-s="2"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Link buying / selling</h3><span class="gl-sc" aria-label="Impact score 2 out of 10"><b>2</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Link buying means paying for a link intended to pass ranking value (a &quot;dofollow&quot; link) without disclosure. It violates Google&#x27;s spam policies. Sponsored placements are fine only when marked rel=&quot;sponsored&quot; or nofollow, which by design passes little or no ranking value.</p><p class="gl-ex"><strong>Example:</strong> paying $300 for a &quot;niche edit&quot; link inserted into an old article on a site that sells links to anyone. Sites that sell links tend to sell them to casinos, CBD, and loan com
