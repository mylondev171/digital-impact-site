ticles on a respected newspaper&#x27;s subdirectory. In 2024 Google introduced its &quot;site reputation abuse&quot; policy and has since issued manual actions against host sites, causing these sections to vanish from search.</p><p class="gl-why"><strong>Why 2:</strong> the abusive form is now explicitly penalized. A legitimate cousin exists (genuine expert articles on LinkedIn, real YouTube videos, contributions to real publications, active Reddit participation) and that kind of third-party presence does help AI visibility, but it is credited under brand mentions and Reddit/forum visibility.</p><a class="gl-perma" href="#parasite-seo" aria-label="Link to Parasite SEO">#</a></article><article class="gl-term b4" id="entity-optimization-knowledge-graph-presence" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Entity optimization / knowledge graph presence</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">An entity is a uniquely identifiable thing: a person, company, product, place, or concept. Google&#x27;s Knowledge Graph and LLMs store facts about entities and their relationships. Entity optimization means making your brand and people clearly and consistently identifiable: consistent names and descriptions everywhere, Organization and Person schema with sameAs links to official profiles, a clear About page, and presence in trusted databases (Wikidata, Crunchbase, industry directories, GBP).</p><p class="gl-ex"><strong>Analogy:</strong> being a named, well-documented character in the story the web tells, rather than an anonymous extra. If the system is sure who you are, it can confidently say good things about you.</p><p class="gl-ex"><strong>Example:</strong> two companies named &quot;Apex Solutions&quot; exist. The one with consistent schema, a Wikidata entry, a LinkedIn page, and press describing it as &quot;Apex Solutions, the Louisville-based logistics software company&quot; gets a knowledge panel and is correctly described by LLMs; the other gets confused with it.</p><p class="gl-why"><strong>Why 8:</strong> LLMs and Google both reason in entities. Clear entity signals reduce mistaken or missing mentions and are a precondition for knowledge panels.</p><a class="gl-perma" href="#entity-optimization-knowledge-graph-presence" aria-label="Link to Entity optimization / knowledge graph presence">#</a></article><article class="gl-term b4" id="structured-extractable-content-formatting" data-term="" data-s="7"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Structured, extractable content formatting</h3><span class="gl-sc" aria-label="Impact score 7 out of 10"><b>7</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><p class="gl-def">This means formatting content so that individual passages can be lifted out and still make sense: descriptive headings phrased like questions, short self-contained paragraphs, one idea per section, lists for steps, real HTML tables for comparisons, definitions in the first sentence, and specific facts rather than vague claims.</p><p class="gl-ex"><strong>Analogy:</strong> writing in Lego bricks rather than poured concrete. Each brick can be picked up and used elsewhere without breaking.</p><p class="gl-ex"><strong>Example:</strong> &quot;It depends on many factors&quot; cannot be quoted. &quot;Asphalt shingle roofs last 20 to 30 years; metal roofs last 40 to 70&quot; can.</p><p class="gl-why"><strong>Why 7:</strong> retrieval systems chunk pages into passages and select the best chunk. Clean, specific chunks are much more likely to be quoted, and the same formatting helps featured snippets and readers.</p><a class="gl-perma" href="#structured-extractable-content-formatting" aria-label="Link to Structured, extractable content formatting">#</a></article><article class="gl-term b5" id="brand-mention-frequency-across-the-web" data-term="" data-s="9"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Brand mention frequency across the web</h3><span class="gl-sc" aria-label="Impact score 9 out of 10"><b>9</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span><p class="gl-def">This is how often your brand is mentioned (linked or not) across reputable sources, especially alongside the topics and categories you want to be known for. It is the AI-search counterpart of backlinks, and arguably now more important for LLM recommendations than links. Large-scale studies of AI visibility have repeatedly found that brand web mentions correlate more strongly with AI Overview and chatbot visibility than backlink counts do.</p><p class="gl-ex"><strong>Example:</strong> a project-management tool that appears in 40 independent &quot;best PM tools&quot; articles, 200 Reddit threads, and 1,500 G2 reviews will be named by ChatGPT; a technically superior competitor mentioned in five places will not.</p><p class="gl-why"><strong>Why 9:</strong> the strongest single lever for appearing in LLM answers. It is earned through PR, product quality, reviews, community presence, partnerships, and being genuinely discussed.</p><a class="gl-perma" href="#brand-mention-frequency-across-the-web" aria-label="Link to Brand mention frequency across the web">#</a></article><article class="gl-term b1" id="llms-txt" data-term="" data-s="1"><header class="gl-th"><h3 class="gl-tn" data-term-name="">llms.txt</h3><span class="gl-sc" aria-label="Impact score 1 out of 10"><b>1</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">llms.txt is a proposed standard (from 2024) for a Markdown file at your domain root (/llms.txt) that lists your most important pages with short descriptions, intended to help AI models navigate your site. Unlike robots.txt, it grants or blocks nothing.</p><p class="gl-ex">The evidence so far is weak. Google has said it does not use it and compared it to the old keywords meta tag. As of 2026 no major AI company (OpenAI, Google, Anthropic, Meta) has publicly committed to reading it in production, and an Ahrefs study of 137,000 sites found 97 percent of llms.txt files received zero requests in May 2026. The one niche where it sees real use is developer documentation read by AI coding tools.</p><p class="gl-why"><strong>Why 1:</strong> low cost and harmless, but there is no evidence it improves rankings or citations. Do it only after everything else, or if you publish developer docs.</p><a class="gl-perma" href="#llms-txt" aria-label="Link to llms.txt">#</a></article><article class="gl-term b3" id="statistics-quotable-data-inclusion" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Statistics / quotable data inclusion</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">This means including specific statistics, data points, expert quotations, and cited sources in your content. A 2023 Princeton-led study on generative engine optimization found that adding statistics, quotations, and citations increased visibility in AI-generated answers by roughly 30 to 40 percent in their tests, more than any other content change they tried.</p><p class="gl-ex"><strong>Example:</strong> &quot;Most homeowners save money with solar&quot; becomes &quot;In Kentucky, the median residential solar system pays for itself in 11 years, based on 2026 utility rates and the 30 percent federal tax credit.&quot; The second sentence is quotable; the first is filler.</p><p class="gl-why"><strong>Why 6:</strong> cheap to apply and well-supported for AI visibility. It works best when the data is original (see information gain, 9); recycled stats help less.</p><a class="gl-perma" href="#statistics-quotable-data-inclusion" aria-label="Link to Statistics / quotable data inclusion">#</a></article><article class="gl-term b3" id="wikipedia-wikidata-presence" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Wikipedia / Wikidata presence</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Wikipedia is among the most heavily weighted sources in LLM training data and a primary source for Google&#x27;s Knowledge Graph. Wikidata is the structured database behind Wikipedia, which machines read directly. Having an accurate Wikipedia article (if you meet notability rules) and a Wikidata entry strongly anchors your entity.</p><p class="gl-ex">Important caveat: Wikipedia&#x27;s conflict-of-interest rules discourage writing about your own company, and articles without independent, reliable sources get deleted. The realistic path is earning enough independent press coverage that an article is justified, then disclosing any involvement.</p><p class="gl-ex"><strong>Example:</strong> a company with a Wikipedia article is described accurately and confidently by nearly every LLM; one without may be described vaguely or confused with similarly named entities.</p><p class="gl-why"><strong>Why 6:</strong> very high impact when achievable (closer to 9), but most small and mid-sized businesses do not meet notability rules. Wikidata entries are easier and still useful.</p><a class="gl-perma" href="#wikipedia-wikidata-presence" aria-label="Link to Wikipedia / Wikidata presence">#</a></article><article class="gl-term b4" id="reddit-forum-visibility-llm-training-sources" data-term="" data-s="7"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Reddit / forum visibility (LLM training sources)</h3><span class="gl-sc" aria-label="Impact score 7 out of 10"><b>7</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><p class="gl-def">Reddit, Quora, Stack Overflow, and niche forums are heavily represented in LLM training data and in live retrieval. Google licensed Reddit data in 2024 and OpenAI followed, and Reddit threads rank prominently in Google. Visibility here means being genuinely recommended in relevant discussions: having real customers mention you, participating transparently as a brand or employee, and answering questions helpfully.</p><p class="gl-ex"><strong>Analogy:</strong> the online version of a neighborhood barbershop conversation. People trust it because it feels unpolished and unsponsored, which is exactly why fake participation gets punished hard.</p><p class="gl-ex"><strong>Example:</strong> an accounting software company&#x27;s support team answers questions in r/smallbusiness under clearly labeled accounts, building a track record that shows up when people ask ChatGPT for recommendations.</p><p class="gl-why"><strong>Why 7:</strong> among the most cited source types in AI answers for product and service recommendations. Must be done authentically; Reddit communities ban self-promotion and detect sock puppets.</p><a class="gl-perma" href="#reddit-forum-visibility-llm-training-sources" aria-label="Link to Reddit / forum visibility (LLM training sources)">#</a></article><article class="gl-term b4" id="answer-first-content-structure" data-term="" data-s="7"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Answer-first content structure</h3><span class="gl-sc" aria-label="Impact score 7 out of 10"><b>7</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span><p class="gl-def">Answer-first (sometimes called BLUF, &quot;bottom line up front,&quot; or the inverted pyramid) means stating the direct answer in the first one or two sentences of a page or section, then expanding with detail, evidence, and nuance.</p><p class="gl-ex"><strong>Analogy:</strong> journalists write news this way so readers who stop after one paragraph still get the story. AI systems often &quot;stop after one paragraph&quot; too.</p><p class="gl-ex"><strong>Example:</strong> under &quot;How much does a new roof cost?&quot; the first line is &quot;A new asphalt shingle roof costs $8,000 to $15,000 for a typical 2,000-square-foot home in 2026.&quot; The breakdown by material and region follows.</p><p class="gl-why"><strong>Why 7:</strong> directly increases the chance a passage is extracted for AI Overviews, featured snippets, and LLM citations, and it serves users who want quick answers. Easy to apply to existing content.</p><a class="gl-perma" href="#answer-first-content-structure" aria-label="Link to Answer-first content structure">#</a></article></div></div></section><section class="gl-sec gl-alt" id="ecommerce-seo" data-spy="" aria-labelledby="ecommerce-seo-h"><div class="wrap gl-sgrid"><aside class="gl-aside"><div class="gl-stick"><div class="gl-snum"><b>08</b><span>10 terms</span></div><h2 class="gl-sh" id="ecommerce-seo-h">E-commerce SEO</h2><p class="gl-sintro">These scores assume an online store; for other sites they do not apply. For stores, category (collection) pages and clean product data are the biggest levers, and product feeds now matter for AI shopping answers as much as for Google Shopping.</p><div class="gl-rbox"><span class="e-eb">Ranked by impact</span><ol class="gl-rank"><li class="b5" data-for="collection-page-optimization"><a href="#collection-page-optimization"><span class="gl-rn">Collection page optimization</span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b4" data-for="product-page-optimization"><a href="#product-page-optimization"><span class="gl-rn">Product page optimization</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4" data-for="product-schema-price-reviews-availability"><a href="#product-schema-price-reviews-availability"><span class="gl-rn">Product schema (price, reviews, availability)</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4" data-for="product-review-optimization"><a href="#product-review-optimization"><span class="gl-rn">Product review optimization</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4" data-for="merchant-center-google-shopping-feed"><a href="#merchant-center-google-shopping-feed"><span class="gl-rn">Merchant Center / Google Shopping feed</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b3" data-for="faceted-navigation-seo"><a href="#faceted-navigation-seo"><span class="gl-rn">Faceted navigation SEO</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="out-of-stock-page-handling"><a href="#out-of-stock-page-handling"><span class="gl-rn">Out-of-stock page handling</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b3" data-for="duplicate-product-description-handling"><a href="#duplicate-product-description-handling"><span class="gl-rn">Duplicate product description handling</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b2" data-for="internal-search-optimization"><a href="#internal-search-optimization"><span class="gl-rn">Internal search optimization</span><span class="gl-rb" aria-hidden="true"><i style="width: 40%"></i></span><b>4</b></a></li><li class="b2" data-for="competitor-data-extraction"><a href="#competitor-data-extraction"><span class="gl-rn">Competitor data extraction</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li></ol><button type="button" class="gl-more" aria-expanded="false">Show all 10</button></div></div></aside><div class="gl-terms"><article class="gl-term b4" id="product-page-optimization" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Product page optimization</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">Product page optimization makes each product detail page (PDP) rank and convert: a descriptive title with brand, model, and key attributes; unique descriptions that answer buyer questions; full specs; multiple high-quality images and video; price and availability; shipping and return details; reviews; and links to related products and the parent category.</p><p class="gl-ex"><strong>Example:</strong> &quot;Men&#x27;s Waterproof Hiking Boot&quot; becomes &quot;Merrell Moab 3 Mid Waterproof Hiking Boot, Men&#x27;s, Wide Width Available.&quot; The page adds a sizing guide, a waterproofing test video, and answers to &quot;are these good for snow?&quot;</p><p class="gl-why"><strong>Why 8:</strong> product pages capture high-intent, long-tail searches, and their structured details are what AI shopping answers and comparison prompts pull from.</p><a class="gl-perma" href="#product-page-optimization" aria-label="Link to Product page optimization">#</a></article><article class="gl-term b5" id="collection-page-optimization" data-term="" data-s="9"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Collection page optimization</h3><span class="gl-sc" aria-label="Impact score 9 out of 10"><b>9</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span><p class="gl-def">Collection (category) pages list products in a group: &quot;Women&#x27;s Trail Running Shoes,&quot; &quot;Cast Iron Skillets.&quot; They usually target the highest-volume commercial keywords in a store, because shoppers search for categories more than specific SKUs. Optimization includes a keyword-aligned title and H1, a short helpful intro, buying-guide content or FAQs below the product grid, smart internal links to subcategories, and indexable filter combinations with real demand.</p><p class="gl-ex"><strong>Analogy:</strong> the product page is a single item on the shelf; the collection page is the aisle sign that brings people into the aisle.</p><p class="gl-ex"><strong>Example:</strong> a cookware store&#x27;s &quot;Cast Iron Skillets&quot; page with a 150-word intro, a size comparison table, and a care guide below the grid outranks a competitor whose collection page is only a grid of products.</p><p class="gl-why"><strong>Why 9:</strong> often the most valuable pages in an online store for organic revenue, and the most commonly under-optimized.</p><a class="gl-perma" href="#collection-page-optimization" aria-label="Link to Collection page optimization">#</a></article><article class="gl-term b4" id="product-schema-price-reviews-availability" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Product schema (price, reviews, availability)</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">Product schema is Product structured data including Offer (price, currency, availability, shipping, returns) and AggregateRating and Review. It makes products eligible for rich results such as price, stock status, and review stars in organic listings, and feeds Google&#x27;s Shopping Graph.</p><p class="gl-ex"><strong>Example:</strong> a search result showing &quot;$89.99 · In stock · 4.7 stars (1,284)&quot; gets far more clicks than a plain blue link for the same product.</p><p class="gl-why"><strong>Why 8:</strong> a direct CTR lever and a key data source for AI shopping experiences. Required for competitive product SERPs.</p><a class="gl-perma" href="#product-schema-price-reviews-availability" aria-label="Link to Product schema (price, reviews, availability)">#</a></article><article class="gl-term b3" id="faceted-navigation-seo" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Faceted navigation SEO</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">This is the opportunity side of faceted navigation (the risk side is in Technical SEO): deliberately making high-demand filter combinations into indexable, optimized landing pages with clean URLs, unique titles, and intros, while keeping the millions of low-value combinations out of the index.</p><p class="gl-ex"><strong>Example:</strong> &quot;black leather sofa&quot; and &quot;sectional sofa with chaise&quot; have real search demand, so those filter combinations get static, indexable URLs. &quot;Sofa, color: black, price: $1,200 to $1,400, sort: newest&quot; does not.</p><p class="gl-why"><strong>Why 6:</strong> can unlock thousands of long-tail category rankings for large catalogs, but requires careful engineering to avoid index bloat.</p><a class="gl-perma" href="#faceted-navigation-seo" aria-label="Link to Faceted navigation SEO">#</a></article><article class="gl-term b3" id="out-of-stock-page-handling" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Out-of-stock page handling</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">This is deciding what happens to product pages when items go out of stock or are discontinued. For temporarily out-of-stock items: keep the page live, mark availability correctly in schema, offer back-in-stock alerts and alternatives. For permanently discontinued items: 301 redirect to the replacement or closest category if one exists; otherwise return 404 or 410, or keep the page live with clear alternatives if it still earns traffic and links.</p><p class="gl-ex"><strong>Example:</strong> deleting a popular discontinued blender page that has 40 backlinks throws away that authority. Redirecting it to the successor model preserves it.</p><p class="gl-why"><strong>Why 5:</strong> mishandling it at scale (mass deletions, soft 404s, redirecting everything to the homepage) can quietly erode rankings over time.</p><a class="gl-perma" href="#out-of-stock-page-handling" aria-label="Link to Out-of-stock page handling">#</a></article><article class="gl-term b4" id="product-review-optimization" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Product review optimization</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">This means collecting more, better, and more detailed customer reviews on product pages (post-purchase emails, photo and video reviews, Q&amp;A), displaying them in crawlable HTML, marking them up with schema, and syndicating them to Google through review partners. Reviews add unique, constantly fresh content in customer language.</p><p class="gl-ex"><strong>Example:</strong> a review that says &quot;I&#x27;m 6&#x27;2&quot; and the medium fit perfectly in the shoulders&quot; answers the exact long-tail question &quot;does [shirt] run small for tall guys.&quot;</p><p class="gl-why"><strong>Why 8:</strong> improves rankings, CTR (stars), and conversion together. Reviews and review aggregators are also among the most cited sources when people ask AI assistants which product to buy.</p><a class="gl-perma" href="#product-review-optimization" aria-label="Link to Product review optimization">#</a></article><article class="gl-term b4" id="merchant-center-google-shopping-feed" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Merchant Center / Google Shopping feed</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">Google Merchant Center hosts your product feed (titles, prices, GTINs, images, availability, shipping). The feed powers free Shopping listings, the Shopping tab, product knowledge panels, and Google&#x27;s Shopping Graph, which AI Overviews and AI Mode draw on for product answers. Other AI shopping experiences, such as ChatGPT&#x27;s, increasingly rely on merchant product feeds too.</p><p class="gl-ex"><strong>Example:</strong> a store with complete feeds (correct GTINs, detailed titles, shipping info, high-quality images) appears in free product listings and in AI Mode product carousels; a store without one never does, regardless of how good its website is.</p><p class="gl-why"><strong>Why 8:</strong> free, high-intent visibility that a website alone cannot earn, and a growing input into AI shopping answers.</p><a class="gl-perma" href="#merchant-center-google-shopping-feed" aria-label="Link to Merchant Center / Google Shopping feed">#</a></article><article class="gl-term b3" id="duplicate-product-description-handling" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Duplicate product description handling</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Many stores use the manufacturer&#x27;s stock description, which hundreds of other retailers also use. Google then picks one version to rank, usually the manufacturer or the biggest retailer. Handling means rewriting descriptions for priority products with unique detail, adding original content (reviews, Q&amp;A, usage guides, comparison tables), and managing internal duplicates from product variants with canonicals.</p><p class="gl-ex"><strong>Example:</strong> a niche outdoor retailer rewrites descriptions for its top 200 products with field-testing notes and fit advice, and those pages begin to outrank larger stores using the boilerplate text.</p><p class="gl-why"><strong>Why 5:</strong> meaningful for competitive products, but rewriting thousands of SKUs is costly, so it should be prioritized by revenue.</p><a class="gl-perma" href="#duplicate-product-description-handling" aria-label="Link to Duplicate product description handling">#</a></article><article class="gl-term b2" id="internal-search-optimization" data-term="" data-s="4"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Internal search optimization</h3><span class="gl-sc" aria-label="Impact score 4 out of 10"><b>4</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">This covers two things. First, using your site-search data (what customers type into your search box) to discover demand, missing products, and new category pages to create. Second, preventing internal search result pages from being crawled and indexed, since Google treats them as low-value, infinite pages.</p><p class="gl-ex"><strong>Example:</strong> site-search logs show 800 monthly searches for &quot;wide calf boots&quot; but no such category exists. Creating that collection page captures both internal and Google demand.</p><p class="gl-why"><strong>Why 4:</strong> a valuable research source and a technical hygiene item, but not a direct ranking driver.</p><a class="gl-perma" href="#internal-search-optimization" aria-label="Link to Internal search optimization">#</a></article><article class="gl-term b2" id="competitor-data-extraction" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Competitor data extraction</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">This is collecting competitors&#x27; public data at scale: product catalogs, pricing, category structures, titles and descriptions, review counts, and ranking keywords, using SEO tools, price-monitoring services, or scrapers. It informs pricing, assortment, and content decisions.</p><p class="gl-ex"><strong>Example:</strong> a scrape shows a competitor&#x27;s 30 top-ranking collection pages all include a buying guide and a comparison table, which shapes your own template.</p><p class="gl-ex"><strong>Caution:</strong> scraping can violate a site&#x27;s terms of service, copying competitors&#x27; descriptions creates duplicate content and potential copyright problems, and aggressive scraping can be legally risky. Commercial SEO and price-intelligence tools are the safer route.</p><p class="gl-why"><strong>Why 3:</strong> useful competitive intelligence, but it informs strategy rather than moving rankings, and its value depends entirely on what you do with it.</p><a class="gl-perma" href="#competitor-data-extraction" aria-label="Link to Competitor data extraction">#</a></article></div></div></section><section class="gl-sec" id="serp-features" data-spy="" aria-labelledby="serp-features-h"><div class="wrap gl-sgrid"><aside class="gl-aside"><div class="gl-stick"><div class="gl-snum"><b>09</b><span>9 terms</span></div><h2 class="gl-sh" id="serp-features-h">SERP Features</h2><p class="gl-sintro">SERP features are the special result types Google shows beyond the ten blue links. They are mostly outcomes of the work above rather than levers in themselves, so these scores rate how much winning each one is worth. FAQ and HowTo rich results are now gone entirely, while the local pack and review stars remain the most valuable to earn.</p><div class="gl-rbox"><span class="e-eb">Ranked by impact</span><ol class="gl-rank"><li class="b4" data-for="local-pack"><a href="#local-pack"><span class="gl-rn">Local pack</span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b3" data-for="knowledge-panels"><a href="#knowledge-panels"><span class="gl-rn">Knowledge panels</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="review-stars"><a href="#review-stars"><span class="gl-rn">Review stars</span><span class="gl-rb" aria-hidden="true"><i style="width: 60%"></i></span><b>6</b></a></li><li class="b3" data-for="featured-snippets"><a href="#featured-snippets"><span class="gl-rn">Featured snippets</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b3" data-for="people-also-ask"><a href="#people-also-ask"><span class="gl-rn">People Also Ask</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b3" data-for="video-carousels"><a href="#video-carousels"><span class="gl-rn">Video carousels</span><span class="gl-rb" aria-hidden="true"><i style="width: 50%"></i></span><b>5</b></a></li><li class="b2" data-for="image-packs"><a href="#image-packs"><span class="gl-rn">Image packs</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li><li class="b2" data-for="sitelinks"><a href="#sitelinks"><span class="gl-rn">Sitelinks</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li><li class="b2" data-for="top-stories"><a href="#top-stories"><span class="gl-rn">Top stories</span><span class="gl-rb" aria-hidden="true"><i style="width: 30%"></i></span><b>3</b></a></li></ol><button type="button" class="gl-more" aria-expanded="false">Show all 9</button></div></div></aside><div class="gl-terms"><article class="gl-term b3" id="featured-snippets" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Featured snippets</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">A featured snippet is the highlighted answer box at or near the top of results, quoting a paragraph, list, or table from one page with a link. It is earned by giving a concise, direct answer under a matching heading on a page that already ranks on page one.</p><p class="gl-ex"><strong>Example:</strong> searching &quot;how long to boil an egg&quot; shows a snippet stating the times for soft and hard-boiled eggs, quoted from one recipe site.</p><p class="gl-why"><strong>Why 5:</strong> still valuable visibility, but AI Overviews now appear above or instead of snippets on many queries, and snippets sometimes answer the question so fully that users do not click. The formatting skill transfers directly to AI citations.</p><a class="gl-perma" href="#featured-snippets" aria-label="Link to Featured snippets">#</a></article><article class="gl-term b3" id="people-also-ask" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">People Also Ask</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">People Also Ask (PAA) is the expandable box of related questions; clicking one reveals a short answer from a web page and loads more questions. Pages earn PAA placements by answering those questions clearly and concisely.</p><p class="gl-ex"><strong>Example:</strong> searching &quot;metal roof&quot; shows PAA questions like &quot;What are the disadvantages of a metal roof?&quot; Each answer is a citation opportunity.</p><p class="gl-why"><strong>Why 5:</strong> individually low-traffic, but PAA is the best free map of what searchers and AI systems consider the follow-up questions for a topic, and answering them strengthens topical coverage.</p><a class="gl-perma" href="#people-also-ask" aria-label="Link to People Also Ask">#</a></article><article class="gl-term b3" id="knowledge-panels" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Knowledge panels</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">A knowledge panel is the information box (usually on the right on desktop) about an entity: a company, person, organization, or place. It pulls from Google&#x27;s Knowledge Graph, using sources like Wikipedia, Wikidata, official websites, and social profiles. Verified entities can claim their panel and suggest edits.</p><p class="gl-ex"><strong>Example:</strong> searching a well-known company name shows a panel with its logo, founders, headquarters, stock price, and social links.</p><p class="gl-why"><strong>Why 6:</strong> a panel signals that Google understands your entity, which correlates strongly with how accurately LLMs describe you. It is mainly a branded-search and trust asset rather than a traffic driver.</p><a class="gl-perma" href="#knowledge-panels" aria-label="Link to Knowledge panels">#</a></article><article class="gl-term b2" id="image-packs" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Image packs</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">An image pack is a row of image thumbnails embedded in regular results, linking to Google Images. It appears for visually oriented queries.</p><p class="gl-ex"><strong>Example:</strong> &quot;modern farmhouse kitchen ideas&quot; shows an image pack; a design blog with original, well-labeled photos can capture clicks there.</p><p class="gl-why"><strong>Why 3:</strong> high value in visual niches (home decor, fashion, recipes, products) and negligible elsewhere. Earned through original images, descriptive filenames, alt text, and fast image delivery.</p><a class="gl-perma" href="#image-packs" aria-label="Link to Image packs">#</a></article><article class="gl-term b3" id="video-carousels" data-term="" data-s="5"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Video carousels</h3><span class="gl-sc" aria-label="Impact score 5 out of 10"><b>5</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">A video carousel is a horizontal row of videos in results, dominated by YouTube but also including other platforms and on-site videos with VideoObject schema. They appear for how-to, review, and demonstration queries.</p><p class="gl-ex"><strong>Example:</strong> &quot;how to replace a toilet flapper&quot; shows a video carousel above most articles. A plumbing company with a clear three-minute YouTube video can outrank national publishers.</p><p class="gl-why"><strong>Why 5:</strong> a real opportunity in how-to and review niches, and YouTube videos are among the most frequently cited sources in AI Overviews and LLM answers. Requires video production capacity.</p><a class="gl-perma" href="#video-carousels" aria-label="Link to Video carousels">#</a></article><article class="gl-term b2" id="sitelinks" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Sitelinks</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Sitelinks are additional links to subpages shown beneath a main result, most often for branded searches. Google generates them automatically from site structure; you cannot request them directly.</p><p class="gl-ex"><strong>Example:</strong> searching a brand name shows its homepage with sitelinks to &quot;Pricing,&quot; &quot;Login,&quot; &quot;Contact,&quot; and &quot;Careers.&quot;</p><p class="gl-why"><strong>Why 3:</strong> they take up more SERP space and help navigation on branded searches, but you cannot directly control them. Good architecture and clear navigation make them more likely.</p><a class="gl-perma" href="#sitelinks" aria-label="Link to Sitelinks">#</a></article><article class="gl-term b3" id="review-stars" data-term="" data-s="6"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Review stars</h3><span class="gl-sc" aria-label="Impact score 6 out of 10"><b>6</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Review stars (review snippets) are star ratings shown under a result, drawn from Review or AggregateRating schema. Since 2019, Google does not show stars for &quot;self-serving&quot; reviews of your own business on your own site (LocalBusiness and Organization types), but they remain available for products, recipes, software, books, courses, and similar items.</p><p class="gl-ex"><strong>Example:</strong> two identical product listings, one showing &quot;4.8 stars (2,341 reviews)&quot; and one plain. Studies consistently find the starred result gets a meaningfully higher click-through rate.</p><p class="gl-why"><strong>Why 6:</strong> a significant CTR boost for eligible content types, especially e-commerce, at low cost once reviews and schema are in place.</p><a class="gl-perma" href="#review-stars" aria-label="Link to Review stars">#</a></article><article class="gl-term b2" id="top-stories" data-term="" data-s="3"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Top stories</h3><span class="gl-sc" aria-label="Impact score 3 out of 10"><b>3</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><p class="gl-def">Top stories is the carousel of recent news articles shown for newsworthy queries. Inclusion favors established news publishers with strong reputations, fast publishing, and original reporting; no specific markup is required, though Article schema and fast pages help.</p><p class="gl-ex"><strong>Example:</strong> &quot;Federal Reserve rate decision&quot; shows top stories from major outlets within minutes of an announcement.</p><p class="gl-why"><strong>Why 3:</strong> essential for news publishers (for them it is a 9), largely irrelevant for most businesses except when they are the subject of news.</p><a class="gl-perma" href="#top-stories" aria-label="Link to Top stories">#</a></article><article class="gl-term b4" id="local-pack" data-term="" data-s="8"><header class="gl-th"><h3 class="gl-tn" data-term-name="">Local pack</h3><span class="gl-sc" aria-label="Impact score 8 out of 10"><b>8</b><small>/10</small></span></header><span class="gl-meter" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span><p class="gl-def">The local pack is the map with three business listings shown for local-intent searches; it is covered in depth in the Local SEO section (map pack ranking and Google Business Profile). As a SERP feature it typically appears above the organic results and captures a large share of clicks and calls for local queries.</p><p class="gl-ex"><strong>Example:</strong> &quot;emergency plumber&quot; on a phone shows a map and three plumbers with call buttons before any organic result.</p><p class="gl-why"><strong>Why 8:</strong> for local businesses it is often the most valuable real estate on the page. For non-local businesses it scores 0, which is why this is not a 10.</p><a class="gl-perma" href="#local-pack" aria-label="Link to Local pack">#</a></article></div></div></section>

<section class="gl-pri" id="priorities" data-spy="" aria-labelledby="pri-h">
<div class="wrap">
<span class="e-eb">Where to spend effort first</span>
<h2 class="e-h2" id="pri-h">Access. Relevance. <span class="it">Trust.</span></h2>
<p class="e-p">For any site, the priority order is: make sure bots can reach and index you, build the best and most original content on a focused topic, then earn the links and mentions that make Google and LLMs trust you.</p>
<ol class="gl-play"><li><span class="gl-pn">1</span><strong>Access</strong><p>Make sure bots can reach and index you.</p><a href="#technical-seo">Technical SEO <span aria-hidden="true">→</span></a></li><li><span class="gl-pn">2</span><strong>Relevance</strong><p>Build the best and most original content on a focused topic.</p><a href="#content-strategy">On-page, keywords and content <span aria-hidden="true">→</span></a></li><li><span class="gl-pn">3</span><strong>Trust</strong><p>Earn the links and mentions that make Google and LLMs trust you.</p><a href="#off-page-seo">Off-page and AI search <span aria-hidden="true">→</span></a></li></ol>
<div class="gl-chart">
<div><h3>Every site: 18 variables score 8 or higher</h3><p class="e-p">In the chart, Access items are gatekeepers, Relevance items decide whether you match the query, and Trust items (links, mentions, entities) decide whether you are believed.</p></div>
<ol class="gl-top"><li class="b5"><a href="#crawlability"><span class="gl-tk">01</span><span class="gl-tnm"><strong>Crawlability</strong><small>Technical SEO</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 100%"></i></span><b>10</b></a></li><li class="b5"><a href="#indexability"><span class="gl-tk">02</span><span class="gl-tnm"><strong>Indexability</strong><small>Technical SEO</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 100%"></i></span><b>10</b></a></li><li class="b5"><a href="#search-intent-classification"><span class="gl-tk">03</span><span class="gl-tnm"><strong>Search intent classification</strong><small>Keyword Research</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b5"><a href="#content-optimization"><span class="gl-tk">04</span><span class="gl-tnm"><strong>Content optimization</strong><small>On-Page SEO</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b5"><a href="#topical-authority-building"><span class="gl-tk">05</span><span class="gl-tnm"><strong>Topical authority building</strong><small>Content Strategy</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b5"><a href="#information-gain-original-data"><span class="gl-tk">06</span><span class="gl-tnm"><strong>Information gain / original data</strong><small>Content Strategy</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b5"><a href="#link-building"><span class="gl-tk">07</span><span class="gl-tnm"><strong>Link building</strong><small>Off-Page SEO</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b5"><a href="#digital-pr"><span class="gl-tk">08</span><span class="gl-tnm"><strong>Digital PR</strong><small>Off-Page SEO</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b5"><a href="#brand-mentions-citations"><span class="gl-tk">09</span><span class="gl-tnm"><strong>Brand mentions / mention frequency</strong><small>Off-Page SEO and GEO</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 90%"></i></span><b>9</b></a></li><li class="b4"><a href="#site-architecture-url-structure"><span class="gl-tk">10</span><span class="gl-tnm"><strong>Site architecture / URL structure</strong><small>Technical SEO</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4"><a href="#mobile-friendliness-responsive-design"><span class="gl-tk">11</span><span class="gl-tnm"><strong>Mobile-friendliness</strong><small>Technical SEO</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4"><a href="#javascript-rendering-ssr-vs-csr"><span class="gl-tk">12</span><span class="gl-tnm"><strong>JavaScript rendering / SSR</strong><small>Technical SEO</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4"><a href="#internal-linking"><span class="gl-tk">13</span><span class="gl-tnm"><strong>Internal linking</strong><small>On-Page SEO</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4"><a href="#title-tags"><span class="gl-tk">14</span><span class="gl-tnm"><strong>Title tags</strong><small>On-Page SEO</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4"><a href="#content-depth-comprehensiveness"><span class="gl-tk">15</span><span class="gl-tnm"><strong>Content depth</strong><small>On-Page SEO</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4"><a href="#ai-overviews-optimization"><span class="gl-tk">16</span><span class="gl-tnm"><strong>AI Overviews optimization</strong><small>GEO / AI Search</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4"><a href="#llm-citation-optimization-chatgpt-claude-perplexity-gemini"><span class="gl-tk">17</span><span class="gl-tnm"><strong>LLM citation optimization</strong><small>GEO / AI Search</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li><li class="b4"><a href="#entity-optimization-knowledge-graph-presence"><span class="gl-tk">18</span><span class="gl-tnm"><strong>Entity optimization</strong><small>GEO / AI Search</small></span><span class="gl-rb" aria-hidden="true"><i style="width: 80%"></i></span><b>8</b></a></li></ol>
</div>
<div class="gl-notes"><div class="gl-note add"><p>Local businesses should add Google Business Profile (10), review generation (9), local pack ranking (8), and proximity / relevance / prominence work (8) to the top of this list. Online stores should add collection pages (9), plus product pages, product schema, product reviews, and the Merchant Center feed (all 8).</p></div><div class="gl-note skip"><p>Skip or avoid (scores 0 to 2): FAQ / How-to rich results (0, retired by Google), sneaky backlinks, tiered link building, private blog networks, and llms.txt (1 each), and link buying, link velocity, spam link discovery, consensus manufacturing, and parasite SEO (2 each). The manipulative ones on that list can still produce short-term wins, but their penalty and reputation risk makes them a bad trade for any business planning to be around in two years.</p></div></div>
<div class="gl-src" id="sources"><h3>Sources</h3><ul><li><a href="https://www.searchenginejournal.com/google-drops-faq-rich-results-from-search/574429/" target="_blank" rel="noopener">Google drops FAQ rich results from Search (Search Engine Journal, May 2026)</a></li><li><a href="https://www.seroundtable.com/google-drops-faq-rich-results-41298.html" target="_blank" rel="noopener">Google Search drops FAQ rich results in Search and Search Console (Search Engine Roundtable, May 2026)</a></li><li><a href="https://www.thehoth.com/blog/google-faq-rich-results-deprecated/" target="_blank" rel="noopener">Google killed FAQ rich results (The HOTH, citing the February 2026 Ahrefs AI Overviews study)</a></li><li><a href="https://aisaasradar.com/article/llms-txt-adoption-data-2026" target="_blank" rel="noopener">We publish an llms.txt; the 2026 data says almost nothing reads it (September 2026)</a></li><li><a href="https://f9xr.org/articles/2026/09/08/llms-txt-ai-txt-do-they-work-2026.html" target="_blank" rel="noopener">llms.txt and ai.txt in 2026: do they really work? (September 2026)</a></li></ul></div>
</div>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: false };
  }
  renderVals() {
    const s = this.state;
    return {
      menuOpen: !!s.menuOpen,
      menuExp: s.menuOpen ? 'true' : 'false',
      menuToggle: () => this.setState({ menuOpen: !this.state.menuOpen }),
      menuClose: () => this.setState({ menuOpen: false })
    };
  }
}
</script>
