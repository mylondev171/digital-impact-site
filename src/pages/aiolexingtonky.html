 that matches how people ask questions.</p></div></div><div class="e-gc" style="grid-column: span 4; display: grid"><div id="ch3" style="display: flex; flex-direction: column; gap: 12px; padding: clamp(22px, 2.4vw, 32px); border-radius: 22px; background: #ffffff; box-shadow: 0 18px 40px rgba(22, 21, 21, .1)"><span class="e-x" style="font-size: 15px; color: #e44443">03</span><h3 class="e-x" style="margin: 0; font-size: clamp(20px, 1.8vw, 26px); line-height: 1">GEO: Generative Engine Optimization</h3><p style="margin: 0; font-size: 16px; line-height: 1.65; color: #3b3636">GEO focuses on optimizing your content for generative AI platforms that create summaries, recommendations, or overviews; like those found in ChatGPT or Gemini ai. GEO ensures your business appears in AI-generated responses, increasing your visibility when users rely on generative ai for decision-making.</p></div></div></div></div>

<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.FAQ = [];
    this.state = { faqOpen: this.FAQ.map((f, i) => i === 0), sent: false, sel: [false, false, false, false, false, false], tl: -1, menuOpen: false, vidIdle: true };
  }
  componentDidMount() {
    const v = document.querySelector('.e-vidv');
    if (!v) return;
    const mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    v.muted = true;
    v.loop = true;
    v.playsInline = true;
    if (mq && mq.matches) v.pause(); else { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    this._ended = () => {
      if (v.dataset.loop) v.src = v.dataset.loop;
      v.controls = false; v.muted = true; v.loop = true; v.currentTime = 0;
      if (!(mq && mq.matches)) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
      this.setState({ vidIdle: true });
    };
    v.addEventListener('ended', this._ended);
  }
  componentWillUnmount() {
    const v = document.querySelector('.e-vidv');
    if (v && this._ended) v.removeEventListener('ended', this._ended);
  }
  renderVals() {
    const s = this.state;
    const allOpen = this.FAQ.length > 0 && s.faqOpen.every((x) => x);
    const v = {
      notSent: !s.sent,
      sent: s.sent,
      send: () => this.setState({ sent: true }),
      faqAllLabel: allOpen ? 'Collapse all' : 'Expand all',
      faqAll: () => this.setState({ faqOpen: this.FAQ.map(() => !allOpen) }),
      faqs: this.FAQ.map((f, i) => {
        const open = !!s.faqOpen[i];
        return {
          num: (i < 9 ? '0' : '') + (i + 1), q: f[0], a: f[1], open: open,
          exp: open ? 'true' : 'false', icon: open ? '−' : '+',
          ibg: open ? '#161515' : '#ffffff', ifg: open ? '#ffffff' : '#161515',
          toggle: () => { const next = this.state.faqOpen.slice(); next[i] = !next[i]; this.setState({ faqOpen: next }); }
        };
      })
    };
    v.menuOpen = !!s.menuOpen;
    v.vidIdle = s.vidIdle;
    v.vidPlay = () => {
      const el = document.querySelector('.e-vidv');
      if (!el) return;
      if (el.dataset.full) el.src = el.dataset.full;
      el.loop = false; el.muted = false; el.controls = true; el.currentTime = 0;
      const p = el.play(); if (p && p.catch) p.catch(() => {});
      this.setState({ vidIdle: false });
    };
    v.menuExp = s.menuOpen ? 'true' : 'false';
    v.menuToggle = () => this.setState({ menuOpen: !this.state.menuOpen });
    v.menuClose = () => this.setState({ menuOpen: false });
    for (let i = 0; i < 6; i++) {
      const on = !!s.sel[i];
      v['q' + i] = () => { const next = this.state.sel.slice(); next[i] = !next[i]; this.setState({ sel: next }); };
      v['qp' + i] = on ? 'true' : 'false';
      v['qb' + i] = on ? '#161515' : '#ffffff';
      v['qf' + i] = on ? '#ffffff' : '#161515';
    }
    for (let i = 0; i < 4; i++) {
      const on = s.tl === i;
      v['t' + i] = () => this.setState({ tl: i });
      v['tp' + i] = on ? 'true' : 'false';
      v['tb' + i] = on ? '#e44443' : '#ffffff';
      v['tf' + i] = on ? '#ffffff' : '#161515';
    }
    return v;
  }
}
