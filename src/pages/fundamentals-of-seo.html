<span class="e-eb e-rise" style="color: #ff8a89">SEO, the fundamentals</span>
<h1 class="e-h1 e-rise" style="font-size: clamp(44px, 6.4vw, 104px); animation-delay: .08s">Fundamentals of SEO.</h1>
<p class="e-lede e-rise" style="color: #cfc9c9; animation-delay: .16s">How search engines decide who shows up first, the three things every ranking stands on, and how we aim at the searches that bring in customers. A plain-English guide from a Lexington team that has been doing search since 1998.</p>
<div class="e-rise" style="display: flex; flex-wrap: wrap; gap: 12px; animation-delay: .25s"><a class="e-btn" href="/get-a-quote" style="background: #d23a39; color: #ffffff">Get a quote</a><a class="e-ghost" href="tel:8593968606" style="color: #ffffff">Call 859.396.8606</a></div>

<section id="how-search-works" style="padding: clamp(80px, 12vh, 140px) clamp(20px, 5vw, 80px); background: #ffffff">
<div style="display: flex; flex-direction: column; gap: clamp(28px, 4vh, 48px); max-width: 1280px; margin: 0 auto">
<div class="e-split" style="display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(28px, 5vw, 80px); align-items: end">
<div style="display: flex; flex-direction: column; gap: 14px"><span class="e-eb" style="color: #a42e2e">How search engines work</span><h2 class="e-h2">Crawl. Index. Rank.</h2></div>
<p class="e-lede" style="color: #3b3636">Every search engine does the same three jobs before anyone sees a result. SEO is the work of making each one easy for your website.</p>
</div>
<div class="e-bg12" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px"><div class="e-gc" style="grid-column: span 4; display: grid"><div class="e-card" style="background: #ffffff; color: #161515; box-shadow: 0 20px 44px rgba(22, 21, 21, .12)"><span class="e-x" style="font-size: 15px; color: #c93534">01</span><h3 class="e-x" style="margin: 0; font-size: clamp(22px, 2vw, 30px); line-height: .95">Crawl</h3><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3b3636">Search engines send automated crawlers to discover pages by following links and reading sitemaps. If a crawler can't reach a page, that page can't rank.</p></div></div><div class="e-gc" style="grid-column: span 4; display: grid"><div class="e-card" style="background: #e44443; color: #ffffff; box-shadow: 0 20px 44px rgba(22, 21, 21, .12)"><span class="e-x" style="font-size: 15px; color: #161515">02</span><h3 class="e-x" style="margin: 0; font-size: clamp(22px, 2vw, 30px); line-height: .95">Index</h3><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #161515">Each page that gets crawled is analyzed and stored: what it's about, who it's for and how it relates to other pages. Pages that are slow, duplicated or thin may be left out.</p></div></div><div class="e-gc" style="grid-column: span 4; display: grid"><div class="e-card" style="background: #161515; color: #ffffff; box-shadow: 0 20px 44px rgba(22, 21, 21, .12)"><span class="e-x" style="font-size: 15px; color: #ff8a89">03</span><h3 class="e-x" style="margin: 0; font-size: clamp(22px, 2vw, 30px); line-height: .95">Rank</h3><p style="margin: 0; font-size: 16px; line-height: 1.6; color: #cfc9c9">When someone searches, the engine pulls the most relevant, trustworthy pages from its index and puts them in order. Google weighs hundreds of signals, and some weigh far more than others.</p></div></div></div>
</div>
</section>
<section id="e-seo" data-scene="e4" data-mode="reveal" data-hud="SEO" style="position: relative; padding: clamp(96px, 14vh, 160px) clamp(20px, 5vw, 80px); background: #e44443; color: #161515">

<span class="e-eb" style="color: #161515">SEO, the foundation</span>

<p class="e-lede" style="color: #161515; font-weight: 700">SEO improves your visibility on search results pages and grows organic, non-paid traffic. It stands on three legs: technical optimization, content creation and link building. Remove one and the whole thing wobbles. Go ahead, pull a leg out.</p>

<div style="display: flex; flex-direction: column; gap: 20px"><h3 class="e-x" style="margin: 0; font-size: clamp(20px, 1.8vw, 26px)">01 Technical optimization</h3><p class="e-p">Technical SEO makes sure search engines can find, read and trust every page. It's the leg most people never see, and the one that quietly holds the others up.</p><div class="e-bg12" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; margin-top: 6px"><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Fast load times on phones and desktops</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">A clean site structure with clear internal links</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Crawlable pages, an XML sitemap and a robots.txt file</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Secure (HTTPS), mobile-friendly pages</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Structured data that labels your business, services and FAQs</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Fixing broken links, redirect chains and duplicate pages</div></div></div><h3 class="e-x" style="margin: 16px 0 0; font-size: clamp(20px, 1.8vw, 26px)">02 Content creation</h3><p class="e-p">Content is how a search engine learns what you do and who you do it for. Each page should answer one search clearly and completely, in the words your customers actually use.</p><div class="e-bg12" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; margin-top: 6px"><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Keyword research before a single word is written</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">One focused page for each service and each location</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Titles, headings and descriptions that match the search</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Answers to the questions customers ask before they call</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Updates as your services, prices and markets change</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Writing for people first, search engines second</div></div></div><h3 class="e-x" style="margin: 16px 0 0; font-size: clamp(20px, 1.8vw, 26px)">03 Link building</h3><p class="e-p">Links from other trusted websites act as votes of confidence. A few links from relevant, respected sites are worth far more than a pile of links from anywhere.</p><div class="e-bg12" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; margin-top: 6px"><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Local directories, chambers of commerce and associations</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Industry publications, suppliers and partners</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Earned mentions from news, sponsorships and events</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">No paid link schemes that can trigger penalties</div></div></div></div>

<div style="display: flex; flex-direction: column; gap: 20px"><p class="e-p">Not every ranking factor deserves the same attention. We sort the work by how much it can move your rankings, fix the heaviest items first, then keep working down the list. The exact order depends on your site and your market, but it usually looks something like this.</p><h3 class="e-x" style="margin: 16px 0 0; font-size: clamp(20px, 1.8vw, 26px)">01 Bowling balls: the heavy hitters</h3><p class="e-p">These are the factors that decide whether a page can compete at all. If any of them is missing, polishing the small stuff won't make up for it.</p><div class="e-bg12" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; margin-top: 6px"><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Pages that search engines can crawl and index</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">A page that matches what the searcher actually wants</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Helpful, original content that answers the question fully</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Links from trusted, relevant websites</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">A fast, mobile-friendly site</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">For local businesses, an accurate and active Google Business Profile</div></div></div><h3 class="e-x" style="margin: 16px 0 0; font-size: clamp(20px, 1.8vw, 26px)">02 Middle weights: the steady gains</h3><p class="e-p">Once the foundation is solid, these sharpen how search engines understand and rank each page. Each one is a modest lift on its own; together they add up.</p><div class="e-bg12" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; margin-top: 6px"><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Title tags and headings built around the keyword phrase</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Internal links that connect related pages</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Structured data for your business, services and FAQs</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Reviews, and thoughtful responses to them</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Fixing broken links and redirect chains</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Images that load quickly and have descriptive alt text</div></div></div><h3 class="e-x" style="margin: 16px 0 0; font-size: clamp(20px, 1.8vw, 26px)">03 Ping pong balls: the fine tuning</h3><p class="e-p">Small refinements that are worth doing, but only after the heavier work is in place. Starting here is how a lot of SEO budgets get spent without much to show for it.</p><div class="e-bg12" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; margin-top: 6px"><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Meta description wording and length</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Small URL changes on pages that already rank</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Image file names</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Extra speed gains on pages that are already fast</div></div></div><h3 class="e-x" style="margin: 16px 0 0; font-size: clamp(20px, 1.8vw, 26px)">04 Then we do it all again</h3><p class="e-p">Search engines update, competitors move and your business changes. So the list gets weighed again on a regular basis, and whatever is now heaviest moves to the top.</p></div>
</div>
</section>

<section id="local-seo" style="padding: clamp(80px, 12vh, 140px) clamp(20px, 5vw, 80px); background: #ffffff">
<div class="e-split" style="display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(28px, 5vw, 80px); max-width: 1280px; margin: 0 auto; align-items: start">

<h2 class="e-h2">Winning the map.</h2>
<p style="margin: 0; font-family: Merriweather, Georgia, serif; font-style: italic; font-size: clamp(18px, 1.5vw, 22px); line-height: 1.45">Relevance, distance and prominence.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 20px"><p class="e-p">For a business that serves Lexington, Louisville or anywhere in Kentucky, the map results often matter more than the blue links below them. Google ranks local results on three things: how well a business matches the search, how close it is to the searcher, and how well known and well reviewed it is.</p><div class="e-bg12" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; margin-top: 6px"><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">A complete, accurate Google Business Profile: categories, hours, services and photos</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">The same business name, address and phone number everywhere you are listed</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">A steady flow of reviews, with thoughtful responses to each one</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Location pages with real local content, not copies with the city name swapped</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Links and mentions from local organizations and news</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Posts and updates that keep your profile active</div></div></div></div>

<span class="e-eb" style="color: #ff8a89">SEO and AI answers</span>
<h2 class="e-h2">SEO in the age of AI answers.</h2>
<p style="margin: 0; font-family: Merriweather, Georgia, serif; font-style: italic; font-size: clamp(18px, 1.5vw, 22px); line-height: 1.45">Same foundation, new places to show up.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 20px"><p class="e-p" style="color: #cfc9c9">ChatGPT, Google AI Overviews, Perplexity and Claude increasingly answer questions directly instead of listing links. They still lean on the same foundations: pages they can crawl, content that answers a question clearly, and signals that a business is trustworthy.</p><p class="e-p" style="color: #cfc9c9">That makes strong SEO the base that answer engine optimization builds on. Get the fundamentals right and you're in a position to be the answer, not just a result.</p><div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px"><a class="e-pill" href="/aioaeogeo">AIO / AEO / GEO explained</a><a class="e-pill" href="/aiolexingtonky">AI search optimization Lexington</a></div></div>

<div class="e-sticky" style="position: sticky; top: 100px; display: flex; flex-direction: column; gap: 16px">
<span class="e-eb" style="color: #a42e2e">Results</span>
<h2 class="e-h2">How long it takes, and how we measure it.</h2>
<p style="margin: 0; font-family: Merriweather, Georgia, serif; font-style: italic; font-size: clamp(18px, 1.5vw, 22px); line-height: 1.45">SEO compounds.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 20px"><p class="e-p">Technical fixes can show up within weeks, once search engines recrawl your pages. New content and links usually take several months to build momentum, and the most competitive phrases take longer still. Rankings earned this way keep working without a cost per click.</p><p class="e-p">No one can guarantee a number one ranking, because no one but Google controls Google. What we do instead is set clear targets, do the work in order of impact, and report what's moving.</p><div class="e-bg12" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; margin-top: 6px"><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Rankings for the keyword phrases we target</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Organic traffic, and the pages it lands on</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Calls, form fills and quote requests from search</div></div><div class="e-gc" style="grid-column: span 6; display: grid"><div class="e-li">Google Business Profile views, calls and direction requests</div></div></div></div>

</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.FAQ = [
      [
            "What is SEO?",
            "SEO, or search engine optimization, is the work of improving a website so it appears higher in unpaid search results on Google, Bing and other search engines. It stands on three legs: technical optimization, content creation and link building."
      ],
      [
            "How long does SEO take to work?",
            "Technical fixes can show results within weeks, once search engines recrawl your pages. New content and links usually take several months to build momentum, and highly competitive keyword phrases take longer. SEO compounds: the work keeps paying off after it's done."
      ],
      [
            "What is the difference between SEO and PPC?",
            "Pay-per-click (PPC) ads appear at the top of search results right away, and you pay each time someone clicks. SEO earns unpaid rankings that take longer to build but keep bringing in traffic without a cost per click. Many businesses run PPC for immediate leads while their SEO grows."
      ],
      [
            "What is local SEO?",
            "Local SEO helps a business show up for searches in its area, including the map results. It depends on a complete Google Business Profile, a consistent name, address and phone number across the web, reviews, and pages with real local content."
      ],
      [
            "What is a keyword phrase?",
            "A keyword phrase is the set of words someone types or speaks into a search engine, like \"roof replacement Lexington.\" We research which phrases your customers use, how often they're searched and how hard they are to win, then build a page around each one."
      ],
      [
            "Do I need a blog for SEO?",
            "Not necessarily. What you need is a clear page for each thing your customers search for: your services, your locations and their most common questions. Articles help when they answer real questions; publishing for its own sake doesn't."
      ],
      [
            "Can anyone guarantee a number one ranking on Google?",
            "No. Google controls its rankings and changes them constantly, so no honest agency can guarantee a position. Be wary of anyone who does. A good SEO partner sets clear targets, does the highest-impact work first and shows you what is moving."
      ],
      [
            "Does SEO still matter now that AI tools answer questions?",
            "Yes. AI tools like ChatGPT, Google AI Overviews and Perplexity draw on pages they can crawl and trust, so the fundamentals of SEO are what put your business in a position to be cited. Answer engine optimization builds on that foundation."
      ]
    ];
    const mq = window.matchMedia ? window.matchMedia('(max-width: 900px)') : null;
    this._mq = mq;
    this.state = { mob: !!(mq && mq.matches), faqOpen: this.FAQ.map((f, i) => i === 0), menuOpen: false, kw: 0, legs: [true, true, true], wobKey: 0 };
  }
  componentDidMount() {
    const mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    const reduce = !!(mq && mq.matches);
    if (this._mq) {
      this._bp = () => this.setState({ mob: this._mq.matches });
      if (this._mq.addEventListener) this._mq.addEventListener('change', this._bp); else this._mq.addListener(this._bp);
    }
    // Same scroll-scene driver as the home page: each scene's progress is written on that scene.
    const setVar = (el, k, v) => { const c = el.__dcv || (el.__dcv = {}); if (c[k] !== v) { c[k] = v; el.style.setProperty(k, v); } };
    const probe = document.createElement('div');
    probe.setAttribute('aria-hidden', 'true');
    probe.style.cssText = 'position: fixed; top: 0; left: 0; width: 0; height: 100vh; visibility: hidden; pointer-events: none';
    document.body.appendChild(probe);
    let vhW = -1, vhH = 900;
    const viewH = () => { const w = window.innerWidth; if (w !== vhW) { vhW = w; vhH = probe.offsetHeight || window.innerHeight || 900; } return vhH; };
    this._tick = () => {
      this._raf = 0;
      const vh = viewH();
      const els = document.querySelectorAll('[data-scene^="e"]');
      for (let i = 0; i < els.length; i++) {
        const el = els[i];
        const r = el.getBoundingClientRect();
        const span = r.height - vh;
        let p = (el.getAttribute('data-mode') === 'reveal' || span <= 2) ? (vh - r.top) / (vh * 0.8) : -r.top / span;
        p = p < 0 ? 0 : p > 1 ? 1 : p;
        if (reduce) p = 1;
        setVar(el, '--' + el.getAttribute('data-scene'), p.toFixed(4));
      }
    };
    this._on = () => { if (!this._raf) this._raf = requestAnimationFrame(this._tick); };
    document.addEventListener('scroll', this._on, true);
    window.addEventListener('resize', this._on);
    this._tick();
    this._t2 = setTimeout(this._tick, 400);
  }
  makeDots() {
    if (this._dots) return this._dots;
    let seed = 11;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const lefts = [9, 23.4, 37.8, 52.2, 66.6, 81];
    const share = [30, 22, 16, 12, 9, 7];
    const spread = [52, 40, 30, 22, 16, 10];
    const MROWS = [20.25, 34.75, 49.25, 63.75, 78.25, 92.75];
    const out = [];
    share.forEach((n, k) => {
      for (let i = 0; i < n; i++) {
        const x0 = 3 + rnd() * 94;
        const y0 = (rnd() * 2 - 1) * 26;
        const jx = (rnd() * 2 - 1) * spread[k];
        const jy = (rnd() * 2 - 1) * spread[k];
        out.push({
          l: 'calc(' + lefts[k] + '% + ' + jx.toFixed(1) + 'px)',
          t: 'calc(46% + ' + jy.toFixed(1) + 'px)',
          dx: (x0 - lefts[k]).toFixed(2) + 'vw',
          dy: y0.toFixed(2) + 'vh',
          s: (3 + rnd() * 6).toFixed(1),
          ml: 'calc(clamp(20px, 5vw, 80px) + 64px + ' + (jx * .55).toFixed(1) + 'px)',
          mt: 'calc(' + MROWS[k] + '% + ' + (jy * .55).toFixed(1) + 'px)',
          mdx: 'calc(' + x0.toFixed(2) + 'vw - 84px)',
          mdy: ((50 - MROWS[k]) * .5 + y0).toFixed(2) + 'vh'
        });
      }
    });
    this._dots = out;
    return out;
  }
  renderVals() {
    const s = this.state;
    const legs = s.legs;
    const missing = legs.filter((x) => !x).length;
    let tilt = 'rotate(0deg)';
    let origin = '240px 398px';
    if (missing === 1) {
      if (!legs[0]) { tilt = 'rotate(-11deg)'; origin = '385px 398px'; }
      else if (!legs[2]) { tilt = 'rotate(11deg)'; origin = '95px 398px'; }
      else { tilt = 'rotate(-4deg)'; origin = '240px 398px'; }
    } else if (missing === 2) {
      if (legs[0]) { tilt = 'rotate(24deg)'; origin = '95px 398px'; }
      else if (legs[2]) { tilt = 'rotate(-24deg)'; origin = '385px 398px'; }
      else { tilt = 'rotate(-20deg)'; origin = '240px 398px'; }
    } else if (missing === 3) {
      tilt = 'translateY(205px) rotate(-8deg)'; origin = '240px 398px';
    }
    const toggleLeg = (i) => () => {
      const next = legs.slice();
      next[i] = !next[i];
      this.setState({ legs: next, wobKey: s.wobKey + 1 });
    };
    const legProps = {};
    [0, 1, 2].forEach((i) => {
      const on = legs[i];
      legProps['leg' + i] = toggleLeg(i);
      legProps['legP' + i] = on ? 'true' : 'false';
      legProps['legBg' + i] = on ? '#161515' : 'transparent';
      legProps['legBd' + i] = on ? '#161515' : '#161515';
      legProps['legDot' + i] = on ? '#e44443' : 'transparent';
      legProps['legFg' + i] = on ? '#ffffff' : '#161515';
      legProps['legSub' + i] = on ? '#cfc9c9' : '#161515';
      legProps['legO' + i] = on ? 1 : 0.06;
      legProps['legY' + i] = on ? 0 : 40;
      legProps['legGhost' + i] = on ? 0 : 0.9;
      legProps['legLbl' + i] = on ? 1 : 0.35;
    });
    const kwProps = {};
    [0, 1, 2, 3].forEach((i) => {
      const on = s.kw === i;
      kwProps['kw' + i] = () => this.setState({ kw: i });
      kwProps['kp' + i] = on ? 'true' : 'false';
      kwProps['kb' + i] = on ? '#fdecec' : '#ffffff';
      kwProps['kd' + i] = on ? '#e44443' : '#d8d2d0';
      kwProps['h' + i] = on ? 1 : 0;
    });
    const allOpen = this.FAQ.length > 0 && s.faqOpen.every((x) => x);
    return Object.assign({
      mob: !!s.mob,
      desk: !s.mob,
      dots: this.makeDots(),
      tilt: tilt,
      tiltOrigin: origin,
      wob: missing > 0 && missing < 3 ? (s.wobKey % 2 === 0 ? 'e-wobA' : 'e-wobB') : '',
      stoolMsg: missing === 0 ? 'Stable. All three legs working together.' : missing === 3 ? 'No legs, no rankings. Put them back.' : 'Wobbling. Put the leg back to steady it.',
      stoolColor: missing === 0 ? '#161515' : '#ffffff',
      faqAllLabel: allOpen ? 'Collapse all' : 'Expand all',
      faqAll: () => this.setState({ faqOpen: this.FAQ.map(() => !allOpen) }),
      faqs: this.FAQ.map((f, i) => {
        const open = !!s.faqOpen[i];
        return {
          num: (i < 9 ? '0' : '') + (i + 1), q: f[0], a: f[1], open: open,
          hid: !open,
          exp: open ? 'true' : 'false', icon: open ? '−' : '+',
          ibg: open ? '#161515' : '#ffffff', ifg: open ? '#ffffff' : '#161515',
          toggle: () => { const next = this.state.faqOpen.slice(); next[i] = !next[i]; this.setState({ faqOpen: next }); }
        };
      }),
      menuOpen: !!s.menuOpen,
      menuExp: s.menuOpen ? 'true' : 'false',
      menuToggle: () => this.setState({ menuOpen: !this.state.menuOpen }),
      menuClose: () => this.setState({ menuOpen: false })
    }, legProps, kwProps);
  }
}
</script>
