<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.NEEDS = ['New website', 'Redesign', 'Giving & forms', 'Events', 'Search & visibility', 'Something else'];
    this.state = { sent: false, busy: false, err: '', sel: this.NEEDS.map(() => false), menuOpen: false };
  }
  submitForm(e) {
    if (this.state.busy) return;
    const btn = e.currentTarget;
    const box = btn.closest('.formcard');
    const val = (n) => { const el = box && box.querySelector('[name="' + n + '"]'); return el ? el.value.trim() : ''; };
    const site = val('site'), mission = val('mission');
    const comments = (site ? 'Current website: ' + site + '\n\n' : '') + mission;
    const services = this.NEEDS.filter((n, i) => this.state.sel[i]);
    this.setState({ busy: true, err: '' });
    window.diSubmitForm(btn, { form: 'nonprofit', services: services, comments: comments })
      .then(() => this.setState({ sent: true, busy: false }), (err) => this.setState({ busy: false, err: err.message }));
  }
  renderVals() {
    const s = this.state;
    const v = {
      notSent: !s.sent,
      sent: s.sent,
      sendBusy: !!s.busy,
      sendErr: s.err || '',
      send: (e) => this.submitForm(e),
      menuOpen: !!s.menuOpen,
      menuExp: s.menuOpen ? 'true' : 'false',
      menuToggle: () => this.setState({ menuOpen: !this.state.menuOpen }),
      menuClose: () => this.setState({ menuOpen: false })
    };
    this.NEEDS.forEach((n, i) => {
      v['q' + i] = () => { const next = this.state.sel.slice(); next[i] = !next[i]; this.setState({ sel: next }); };
      v['qp' + i] = s.sel[i] ? 'true' : 'false';
    });
    return v;
  }
}
</script>
