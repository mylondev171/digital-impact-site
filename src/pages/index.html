  makeDots() {
    if (this._dots) return this._dots;
    let seed = 11;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const lefts = [9, 23.4, 37.8, 52.2, 66.6, 81];
    const share = [30, 22, 16, 12, 9, 7];
    const spread = [52, 40, 30, 22, 16, 10];
    const MROWS = [20.25, 34.75, 49.25, 63.75, 78.25, 92.75];
    const out = [];
    share.forEach((n, k) => {
      for (let i = 0; i < n; i++) {
        const x0 = 3 + rnd() * 94;
        const y0 = (rnd() * 2 - 1) * 26;
        const jx = (rnd() * 2 - 1) * spread[k];
        const jy = (rnd() * 2 - 1) * spread[k];
        out.push({
          l: 'calc(' + lefts[k] + '% + ' + jx.toFixed(1) + 'px)',
          t: 'calc(46% + ' + jy.toFixed(1) + 'px)',
          dx: (x0 - lefts[k]).toFixed(2) + 'vw',
          dy: y0.toFixed(2) + 'vh',
          s: (3 + rnd() * 6).toFixed(1),
          ml: 'calc(clamp(20px, 5vw, 80px) + 64px + ' + (jx * .55).toFixed(1) + 'px)',
          mt: 'calc(' + MROWS[k] + '% + ' + (jy * .55).toFixed(1) + 'px)',
          mdx: 'calc(' + x0.toFixed(2) + 'vw - 84px)',
          mdy: ((50 - MROWS[k]) * .5 + y0).toFixed(2) + 'vh'
        });
      }
    });

    return out;
