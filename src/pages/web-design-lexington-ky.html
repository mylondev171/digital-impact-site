            "No. Every site we build is custom developed around your business and your brand, never a generic template."
      ],
      [
            "Will a redesign hurt my Google rankings?",
            "It can if it is done carelessly. We redirect every old page to its new home, keep the content that already ranks and fix technical issues during the rebuild, so the new site starts in a stronger position."
      ],
      [
            "Can you help with SEO and marketing after launch?",
            "Yes. Digital Impact has been doing SEO since 1998, and we also manage pay-per-click, social media and AI search optimization, so your new site has a plan to bring in visitors from day one."
      ]
    ];
    this.state = { faqOpen: this.FAQ.map((f, i) => i === 0), menuOpen: false, baPos: 50, dev: 0 };
  }
  renderVals() {
    const s = this.state;
    const allOpen = this.FAQ.length > 0 && s.faqOpen.every((x) => x);
    const v = {
      faqAllLabel: allOpen ? 'Collapse all' : 'Expand all',
      faqAll: () => this.setState({ faqOpen: this.FAQ.map(() => !allOpen) }),
      faqs: this.FAQ.map((f, i) => {
        const open = !!s.faqOpen[i];
        return {
          num: (i < 9 ? '0' : '') + (i + 1), q: f[0], a: f[1], open: open,
          hid: !open,
          exp: open ? 'true' : 'false', icon: open ? '−' : '+',
          ibg: open ? '#161515' : '#ffffff', ifg: open ? '#ffffff' : '#161515',
          toggle: () => { const next = this.state.faqOpen.slice(); next[i] = !next[i]; this.setState({ faqOpen: next }); }
        };
      }),
      menuOpen: !!s.menuOpen,
      menuExp: s.menuOpen ? 'true' : 'false',
      menuToggle: () => this.setState({ menuOpen: !this.state.menuOpen }),
      menuClose: () => this.setState({ menuOpen: false })
    };
    v.baPos = s.baPos;
    v.baMove = (e) => this.setState({ baPos: Number(e.target.value) });
    const DEV = [['min(100%, 980px)', 'Desktop: three columns of services and the full menu.'], ['min(100%, 620px)', 'Tablet: the layout tightens to two columns.'], ['min(100%, 340px)', 'Phone: one column, a tap-friendly menu and the call to action up top.']];
    v.devW = DEV[s.dev][0];
    v.devNote = DEV[s.dev][1];
    DEV.forEach((d, i) => {
      const on = s.dev === i;
      v['dev' + i] = () => this.setState({ dev: i });
      v['devP' + i] = on ? 'true' : 'false';
      v['devB' + i] = on ? '#ffffff' : 'transparent';
      v['devF' + i] = on ? '#161515' : '#ffffff';
    });
    return v;
  }
}
</script>
