<section id="why-branding" style="padding: clamp(80px, 12vh, 140px) clamp(20px, 5vw, 80px); background: #ffffff">

="true">+</span></span><span style="font-size: 16px; font-weight: 700; line-height: 1.5">Earn repeat business and referrals.</span><span class="cr-detail" id="pillar-2" hidden="{{plH2}}">People come back to brands they feel connected to. A brand with a personality gives them something to remember and recommend.</span></button></div><div class="e-gc" style="grid-column: span 6; display: grid"><button type="button" class="cr-pill" onClick="{{pl3}}" aria-expanded="{{plE3}}" aria-controls="pillar-3"><span style="display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%"><span class="e-x" style="font-size: clamp(22px, 2vw, 30px)">Consistency</span><span class="cr-plus" aria-hidden="true">+</span></span><span style="font-size: 16px; font-weight: 700; line-height: 1.5">One message across every channel.</span><span class="cr-detail" id="pillar-3" hidden="{{plH3}}">The same look and voice on your sign, website, ads and social media builds recognition and recall every time someone sees you.</span></button></div></div>

<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.FAQ = [
      [
            "What is the difference between a logo and a brand?",
            "A logo is the symbol and name that identify your business. A brand is everything around it: your colors, typefaces, voice, messaging and the experience customers have with you. A logo is part of a brand."
      ],
      [
            "How long does a logo or branding project take?",
            "A logo can come together in a few weeks, depending on how many rounds of revisions you want. Full brand identity projects that include guidelines and applications take longer. We will give you a timeline when we scope the project."
      ],
      [
            "What files do I get at the end?",
            "Your logo in the formats you need for print, web and signage, plus your color values and typefaces. Branding projects also include simple guidelines that show how to use everything consistently."
      ],
      [
            "Can you refresh my existing logo instead of starting over?",
            "Yes. A refresh can modernize a logo while keeping the recognition you have built. We will tell you honestly whether a refresh or a new direction serves you better."
      ],
      [
            "Do you design print materials?",
            "Yes. We design business cards, brochures, flyers, signage, direct mail and other print pieces, as well as digital ads."
      ],
      [
            "Will my new brand work on my website and social media?",
            "It should be designed to. We plan every brand for the places it will live, and we can carry it through to your website, social media and advertising."
      ]
    ];
    this.state = { faqOpen: this.FAQ.map((f, i) => i === 0), menuOpen: false, pill: 0 };
  }
  componentDidMount() {
    // Scroll-scene driver (same as the home page): each scene's progress is written on that scene.
    const rm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    const reduce = !!(rm && rm.matches);
    const setVar = (el, k, v) => { const c = el.__dcv || (el.__dcv = {}); if (c[k] !== v) { c[k] = v; el.style.setProperty(k, v); } };
    const probe = document.createElement('div');
    probe.setAttribute('aria-hidden', 'true');
    probe.style.cssText = 'position: fixed; top: 0; left: 0; width: 0; height: 100vh; visibility: hidden; pointer-events: none';
    document.body.appendChild(probe);
    let vhW = -1, vhH = 900;
    const viewH = () => { const w = window.innerWidth; if (w !== vhW) { vhW = w; vhH = probe.offsetHeight || window.innerHeight || 900; } return vhH; };
    this._tick = () => {
      this._raf = 0;
      const vh = viewH();
      const els = document.querySelectorAll('[data-scene^="e"]');
      for (let i = 0; i < els.length; i++) {
        const el = els[i];
        const r = el.getBoundingClientRect();
        const span = r.height - vh;
        let p = (el.getAttribute('data-mode') === 'reveal' || span <= 2) ? (vh - r.top) / (vh * 0.8) : -r.top / span;
        p = p < 0 ? 0 : p > 1 ? 1 : p;
        if (reduce) p = 1;
        setVar(el, '--' + el.getAttribute('data-scene'), p.toFixed(4));
      }
    };
    this._on = () => { if (!this._raf) this._raf = requestAnimationFrame(this._tick); };
    document.addEventListener('scroll', this._on, true);
    window.addEventListener('resize', this._on);
    this._tick();
    this._t2 = setTimeout(this._tick, 400);
  }
  renderVals() {
    const s = this.state;
    const allOpen = this.FAQ.length > 0 && s.faqOpen.every((x) => x);
    const v = {
      faqAllLabel: allOpen ? 'Collapse all' : 'Expand all',
      faqAll: () => this.setState({ faqOpen: this.FAQ.map(() => !allOpen) }),
      faqs: this.FAQ.map((f, i) => {
        const open = !!s.faqOpen[i];
        return {
          num: (i < 9 ? '0' : '') + (i + 1), q: f[0], a: f[1], open: open,
          hid: !open,
          exp: open ? 'true' : 'false', icon: open ? '−' : '+',
          ibg: open ? '#161515' : '#ffffff', ifg: open ? '#ffffff' : '#161515',
          toggle: () => { const next = this.state.faqOpen.slice(); next[i] = !next[i]; this.setState({ faqOpen: next }); }
        };
      }),
      menuOpen: !!s.menuOpen,
      menuExp: s.menuOpen ? 'true' : 'false',
      menuToggle: () => this.setState({ menuOpen: !this.state.menuOpen }),
      menuClose: () => this.setState({ menuOpen: false })
    };
    for (let i = 0; i < 4; i++) {
      const on = s.pill === i;
      v['pl' + i] = () => this.setState({ pill: this.state.pill === i ? -1 : i });
      v['plE' + i] = on ? 'true' : 'false';
      v['plH' + i] = !on;
    }
    return v;
  }
}
</script>
